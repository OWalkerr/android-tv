<title>Balon Uçuşu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Tek ekran oyun: tam ekran canvas, üstte ince HUD, sağ altta eylem düğmesi, ortada menü kartları. Gökyüzü dünyası, bilinçli olarak tek tema. */
:root{
  --sky:#8fd3ff; --ink:#1d2b4f; --cream:#fff8ec; --paper:#ffffff; --good:#2fbf71; --good-d:#1f8a50; --bad:#ef4b5c;
  --gold:#ffc23d; --gold-d:#c98d12; --muted:#5a6a8f; --pink:#ff7fc8; --line:#e2d8c6; --grey:#d9dce6; --grey-d:#b4b9c8;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;pointer-events:none;font-family:var(--display);font-weight:800}
#hud .ib{pointer-events:auto}
.chip{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.9);border-radius:999px;padding:2px 12px;font-size:17px;box-shadow:0 3px 10px rgba(29,43,79,.18);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--display);font-weight:800;color:var(--ink)}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,var(--gold) 55%,#d08a10);box-shadow:inset 0 0 0 2px #e0a020;display:inline-block;flex:none}
.star{color:var(--gold);font-size:18px;line-height:1}
#prog{flex:1;height:12px;background:rgba(29,43,79,.25);border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(29,43,79,.18);border-radius:99px;min-width:40px;position:relative}
#progf{height:100%;width:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),linear-gradient(90deg,var(--pink),#ffb03b);border-radius:99px;box-shadow:0 0 10px rgba(255,160,120,.8)}
#progc{position:absolute;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--bad);border:2px solid #fff;transform:translateX(-50%);left:0}
#mult{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 46px);transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:64px;color:#fff;text-shadow:0 4px 0 #c24f92,0 8px 24px rgba(255,127,200,.8);pointer-events:none;line-height:1}
#combo{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 50px);transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,#ff7fc8,#ffb03b);color:#fff;font-family:var(--display);font-weight:800;font-size:20px;padding:2px 14px;border-radius:99px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;font-family:var(--display);font-weight:800;color:#fff;text-shadow:0 4px 0 rgba(29,43,79,.45),0 10px 30px rgba(29,43,79,.35);font-size:38px;animation:bin .5s cubic-bezier(.3,1.6,.5,1);line-height:1.05;width:calc(100% - 32px);text-wrap:balance}
#banner small{display:block;font-size:18px;opacity:.95}
#tip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);pointer-events:none;background:rgba(29,43,79,.88);color:#fff;font-weight:800;font-size:15px;padding:8px 14px;border-radius:14px;max-width:calc(100% - 40px);text-align:center;width:max-content}
#act::before{content:'';position:absolute;inset:6px 14px auto;height:28%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}
#act.pump{animation:pulse .5s ease-in-out infinite}
#act{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:84px;height:84px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:radial-gradient(circle at 35% 30%,#ffe08a,var(--gold) 55%,#e09a1a);color:var(--ink);box-shadow:0 6px 0 var(--gold-d),0 10px 24px rgba(29,43,79,.3);font-size:13px;line-height:1;border:3px solid rgba(255,255,255,.85)}
#act b{font-size:28px;line-height:1}
#act.off{background:var(--grey);box-shadow:0 6px 0 var(--grey-d);color:#7c859d}
#act.pump{background:radial-gradient(circle at 35% 30%,#ffc0e4,var(--pink) 55%,#e0559f);box-shadow:0 6px 0 #c24f92,0 0 30px rgba(255,127,200,.8);color:#fff}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 40%,rgba(20,40,90,.05),rgba(20,40,90,.4))}
@keyframes bin{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(var(--r,0deg))}}
@keyframes cardin{from{transform:translateY(24px) scale(.96);opacity:0}}
.card>*{flex-shrink:0}
.card{background:linear-gradient(180deg,#ffffff,var(--cream) 30%);border:3px solid #fff;animation:cardin .35s cubic-bezier(.3,1.4,.5,1);border-radius:24px;padding:18px;width:min(400px,100%);box-shadow:0 8px 0 rgba(29,43,79,.18),0 20px 50px rgba(29,43,79,.25);display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 12px);overflow:auto}
h1{font-family:var(--display);font-weight:800;font-size:50px;line-height:.92;margin:4px 0 0;text-align:center;letter-spacing:-.5px}
h1 .l{display:inline-block;font-size:60px;color:var(--c);text-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000),0 8px 14px rgba(29,43,79,.25);animation:bob 2.6s ease-in-out infinite;transform:rotate(var(--r,0deg))}
h1 .w2{display:block;font-size:40px;color:var(--ink);text-shadow:0 3px 0 #c9cfe2;letter-spacing:1px}
h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0;text-align:center;line-height:1}
.sub{text-align:center;color:var(--muted);font-weight:800;margin:-4px 0 0}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
button{font-family:var(--display);font-weight:800;border:0;cursor:pointer;border-radius:14px;color:#fff;background:linear-gradient(180deg,#5ee89a,var(--good));text-shadow:0 2px 0 rgba(0,0,0,.15);font-size:22px;padding:9px 16px;box-shadow:0 5px 0 var(--good-d);transition:transform .08s}
button:active{transform:translateY(3px)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
button[disabled]{background:var(--grey);box-shadow:0 4px 0 var(--grey-d);color:#7c859d;cursor:default}
button.big{width:100%;font-size:32px;position:relative;overflow:hidden}
button.big::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
button.sec{background:linear-gradient(180deg,#7dd0ff,#3fb6ff);box-shadow:0 5px 0 #1f7fb8}
button.ghost{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ib{font-size:16px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 2px 0 rgba(29,43,79,.15)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{font-size:16px;padding:7px 4px;background:var(--paper);color:var(--muted);box-shadow:0 3px 0 var(--line)}
.tab.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0d1530}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;background:var(--paper);border-radius:14px;padding:8px 10px}
.it b{font-family:var(--display);font-size:18px;line-height:1.1}
.it small{color:var(--muted);font-weight:700;grid-column:1;font-size:13px}
.it button{grid-row:1/3;grid-column:2;font-size:16px;padding:6px 12px;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d);display:flex;align-items:center;gap:5px;white-space:nowrap}
.it button.chosen{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0d1530}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:#e1e4ee}.dots i.on{background:var(--pink)}
.world{background:var(--paper);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.world b{font-family:var(--display);font-size:17px}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvls button{font-size:18px;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;line-height:1.1;background:#3fb6ff;box-shadow:0 4px 0 #1f7fb8}
.lvls button.boss{background:var(--bad);box-shadow:0 4px 0 #b02b3a}
.lvls button[disabled]{background:var(--grey);box-shadow:0 4px 0 var(--grey-d);color:#7c859d}
.lvls button span{font-size:11px;color:#fff3b0;letter-spacing:1px;min-height:12px}
.hint{font-size:13px;color:var(--muted);text-align:center;font-weight:700;margin:0;line-height:1.35}
.res-x{font-family:var(--display);font-weight:800;font-size:84px;line-height:.9;text-align:center;color:#ff8a3d}
.res-x.fail{color:var(--bad);font-size:56px}
.stars{display:flex;justify-content:center;gap:10px;font-size:44px;line-height:1}
.stars span{color:#e1e4ee;transform:scale(.6);transition:transform .25s cubic-bezier(.3,1.8,.5,1),color .2s}
.stars span.on{color:var(--gold);transform:scale(1)}
.stat{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:2px 4px;font-variant-numeric:tabular-nums}
.stat.tot{font-family:var(--display);font-size:26px;border-top:2px dashed var(--line);padding-top:8px;align-items:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .big{grid-column:1/3}
@media (prefers-reduced-motion:reduce){button,.stars span{transition:none}h1 .l,button.big::after,#act.pump,.card,#banner{animation:none}}
</style>

<canvas id="c"></canvas>
<div id="hud" hidden>
  <button class="ib" id="pauseB" aria-label="Duraklat">❚❚</button>
  <div class="chip" id="lvl">1-1</div>
  <div id="prog"><div id="progf"></div><div id="progc" hidden></div></div>
  <div class="chip"><span class="coin"></span><span id="cc">0</span></div>
</div>
<div id="mult" hidden>x1</div>
<div id="combo" hidden></div>
<div id="banner" hidden></div>
<div id="tip" hidden></div>
<button id="act" hidden aria-label="Safra at"><b id="actB">3</b><span id="actT">SAFRA</span></button>

<div class="ov" id="menu">
  <div class="card">
    <h1 id="logo"><span class="l" style="--c:#ff5a6e;--r:-6deg;animation-delay:0s">B</span><span class="l" style="--c:#ffb03b;--r:4deg;animation-delay:.15s">a</span><span class="l" style="--c:#4fd08a;--r:-3deg;animation-delay:.3s">l</span><span class="l" style="--c:#3fb6ff;--r:5deg;animation-delay:.45s">o</span><span class="l" style="--c:#9b7bff;--r:-4deg;animation-delay:.6s">n</span><span class="w2">UÇUŞU</span></h1>
    <p class="sub" id="msub">Dünya 1 · Kasaba · Bölüm 1</p>
    <div class="row"><span class="chip"><span class="coin"></span><span id="mc">0</span></span><span class="chip"><span class="star">★</span><span id="ms">0</span></span></div>
    <button class="big" id="play">Uç!</button>
    <button class="sec" id="dailyB">Günlük görev</button>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="up" id="tab-up">Yükseltme</button>
      <button class="tab" data-tab="skin" id="tab-skin">Görünüm</button>
      <button class="tab" data-tab="lv" id="tab-lv">Bölümler</button>
    </div>
    <div id="tabc" class="list"></div>
    <div class="row"><button class="ib" id="musB">Müzik: Açık</button><button class="ib" id="sfxB">Efekt: Açık</button></div>
    <p class="hint">Sürükle ya da ← → ile yön ver. Safra atmak için sağ alttaki düğme, boşluk veya ↑. Finişten sonra hızlı dokunarak balonları pompala.</p>
  </div>
</div>

<div class="ov" id="pause" hidden>
  <div class="card">
    <h2>Mola</h2>
    <button class="big" id="resume">Devam et</button>
    <div class="btns"><button class="ghost" id="restart">Baştan</button><button class="ghost" id="toMenu">Menü</button></div>
    <div class="row"><button class="ib" id="musB2">Müzik</button><button class="ib" id="sfxB2">Efekt</button></div>
  </div>
</div>

<div class="ov" id="result" hidden>
  <div class="card">
    <p class="sub" id="rtitle">Ulaştığın çarpan</p>
    <div class="res-x" id="rx">x1</div>
    <div class="stars" id="rstars"><span>★</span><span>★</span><span>★</span></div>
    <div class="stat"><span>Bölüm ödülü</span><span id="rbase">0</span></div>
    <div class="stat"><span>Toplanan altın</span><span id="rcol">0</span></div>
    <div class="stat"><span>Çarpan</span><span id="rmul">x1</span></div>
    <div class="stat" id="rbonusRow" hidden><span id="rbonusL">Günlük bonus</span><span id="rbonus">0</span></div>
    <div class="stat tot"><span>Kazanç</span><span class="chip"><span class="coin"></span><span id="rtot">0</span></span></div>
    <div class="btns"><button class="big" id="next">Sonraki bölüm</button><button class="ghost" id="again">Tekrar</button><button class="ghost" id="rmenu">Menü</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const WW=400,MAXV=50,G0=600,LIFT=120,BM=0.004,BAGM=0.22,HS=2200,ZH=540;
let CW,CH,DPR,S,OX,VH;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);CW=innerWidth;CH=innerHeight;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);S=Math.min(CW/WW,CH/640);OX=(CW-WW*S)/2;VH=CH/S;}
addEventListener('resize',resize);resize();

/* ================= KAYIT ================= */
const KEY='balon-ucusu-v2';
const DEF={coins:0,level:1,stars:{},bestH:{},up:{start:0,latex:0,prop:0,mag:0,bags:0},skin:{bal:'klasik',bas:'hasir'},own:{bas:['hasir']},music:true,sfx:true,tut:0,daily:{d:'',best:0,done:false}};
let save=JSON.parse(JSON.stringify(DEF));
function merge(s){for(const k in DEF){if(s[k]===undefined)continue;save[k]=(DEF[k]&&typeof DEF[k]==='object'&&!Array.isArray(DEF[k]))?Object.assign({},DEF[k],s[k]):s[k];}}
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)merge(s);else{const o=JSON.parse(localStorage.getItem('balon-ucusu-v1'));if(o){save.coins=o.coins||0;save.level=o.level||1;Object.assign(save.up,o.up||{});}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const totalStars=()=>Object.values(save.stars).reduce((a,b)=>a+b,0);

const UPS=[
 {id:'start',name:'Başlangıç balonu',desc:l=>`${12+3*l} balonla kalk`,base:40,g:1.5,max:15},
 {id:'latex',name:'Dayanıklı lateks',desc:()=>'İnce havada daha geç patlar',base:70,g:1.65,max:8},
 {id:'prop',name:'Pervane',desc:()=>'Sepet daha çevik döner',base:35,g:1.55,max:6},
 {id:'mag',name:'Altın mıknatısı',desc:()=>'Yakındaki altınları çeker',base:50,g:1.6,max:6},
 {id:'bags',name:'Ekstra safra',desc:l=>`${3+l} kum torbasıyla kalk`,base:150,g:2.2,max:2}];
const cost=u=>Math.round(u.base*Math.pow(u.g,save.up[u.id]));
const BALS=[{id:'klasik',name:'Klasik balon',star:0},{id:'kalp',name:'Kalp balon',star:6},{id:'yildiz',name:'Yıldız balon',star:15},{id:'kedi',name:'Kedi balon',star:30}];
const BASS=[{id:'hasir',name:'Hasır sepet',coin:0},{id:'fici',name:'Fıçı',coin:400},{id:'kuvet',name:'Küvet',coin:900},{id:'roket',name:'Roket',coin:2000}];

/* ================= DÜNYALAR ================= */
const WORLDS=[
 {name:'Kasaba',top:'#5ab8f5',bot:'#d4f1ff',ground:'town',obs:['bird','spike'],key:0,birdC:'#6b4a35'},
 {name:'Sahil',top:'#3fa9e0',bot:'#ffe6bf',ground:'sea',obs:['gull','spike','storm'],key:2,birdC:'#f4f6fb'},
 {name:'Dağlar',top:'#6f9fd8',bot:'#eef3ff',ground:'mount',obs:['eagle','spike','snow'],key:-3,birdC:'#5a3b22'},
 {name:'Gece Şehri',top:'#141a46',bot:'#5a3f8c',ground:'city',obs:['drone','kite','storm'],key:5,night:true,birdC:'#333'},
 {name:'Stratosfer',top:'#1d2f7a',bot:'#9fb4f0',ground:'cloud',obs:['plane','meteor','eagle'],key:-5,birdC:'#5a3b22'}];
const wIdx=L=>Math.floor((L-1)/5)%5;
const worldOf=L=>WORLDS[wIdx(L)];
const isChase=L=>L%5===0;
const lvName=L=>`${Math.floor((L-1)/5)+1}-${(L-1)%5+1}`;

/* ================= SES ================= */
let AC=null,SFX=null,MUSG=null,lastPop=0;
function au(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();SFX=AC.createGain();MUSG=AC.createGain();SFX.connect(AC.destination);MUSG.connect(AC.destination);applyVol();}if(AC.state==='suspended')AC.resume();musicStart();}catch(e){AC=null}}
function applyVol(){if(!AC)return;SFX.gain.value=save.sfx?1:0;MUSG.gain.value=save.music?0.55:0;}
function tone(f,d,type='sine',v=.15,f2,delay=0){if(!AC||!save.sfx)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(SFX);o.start(t);o.stop(t+d+.02);}
function noise(len,freq,vol,dest,t){if(!AC)return;t=t||AC.currentTime;const b=AC.createBuffer(1,Math.max(1,AC.sampleRate*len|0),AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=freq;s.buffer=b;g.gain.value=vol;s.connect(f).connect(g).connect(dest);s.start(t);}
function popS(){if(!AC||!save.sfx)return;const now=performance.now();if(now-lastPop<40)return;lastPop=now;noise(.08,900+Math.random()*900,.35,SFX);}
function thudS(){if(!AC||!save.sfx)return;tone(120,.25,'sine',.25,50);noise(.12,300,.15,SFX);}
const MUS={next:0,step:0,timer:0};
const PROG=[[0,4],[-3,3],[5,4],[7,4]];
function mnote(m,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(MUSG);o.start(t);o.stop(t+d+.05);}
function mstep(s,t){
  if(G.paused||!save.music)return;
  const W=worldOf(G.L||save.level),base=62+W.key,bar=Math.floor(s/8)%4,[root,third]=PROG[bar],ch=[0,third,7].map(x=>x+root+base),i=s%8;
  const fin=G.phase==='final';
  if(i%4===0)mnote(ch[0]-24,t,.5,'sine',.2);
  if(i===6&&fin)mnote(ch[0]-24,t,.2,'sine',.15);
  const arp=[0,1,2,1,2,0,1,2][i];mnote(ch[arp]+(i>=4?12:0),t,.22,'triangle',fin?.07:.045);
  if(fin&&i%2===1)noise(.03,7000,.06,MUSG,t);
  if(G.chase&&G.phase==='play'&&i%2===0)noise(.04,5000,.05,MUSG,t);
}
function musicStart(){if(!AC||MUS.timer)return;MUS.next=AC.currentTime+.1;MUS.timer=setInterval(()=>{if(!AC)return;const tempo=G.phase==='final'||G.chase&&G.phase==='play'?.2:.25;while(MUS.next<AC.currentTime+.2){mstep(MUS.step++,MUS.next);MUS.next+=tempo;}},60);}

/* ================= YARDIMCILAR ================= */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const PAL=['#ff5a6e','#ffb03b','#ffe04a','#4fd08a','#3fb6ff','#9b7bff','#ff7fc8','#ff8a3d'];
const hx=h=>{const v=parseInt(h.slice(1),16);return[v>>16,v>>8&255,v&255];};
const mix=(a,b,t)=>{a=typeof a==='string'?hx(a):a;b=typeof b==='string'?hx(b):b;return a.map((v,i)=>v+(b[i]-v)*t);};
const css=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const isGood=op=>op==='+'||op==='×'||op==='K'||op==='S';
function applyNum(g,n){const[op,v]=g;if(op==='+')return n+v;if(op==='-')return Math.max(0,n-v);if(op==='×')return n*v;if(op==='÷')return Math.floor(n/v);return n;}
const fmtOp=(op,v)=>op==='?'?'?':op==='K'?'KALKAN':op==='S'?'+1 SAFRA':(op==='-'?'−':op)+v;
const gateCol=op=>op==='?'?'155,123,255':op==='K'?'63,182,255':op==='S'?'255,138,61':isGood(op)?'47,191,113':'239,75,92';
function todayKey(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dailyInfo(){const k=todayKey(),num=+k.replace(/-/g,'');const dn=Math.floor(Date.now()/864e5);return{k,seed:num*31+7,L:3+(dn%5)*5};}

const G={phase:'menu',paused:false,camY:-40,t:0,x:200,y:12,vx:0,vy:0,tx:200,n:12,bags:3,vis:[],esc:[],parts:[],texts:[],sand:[],rows:[],obs:[],coins:[],winds:[],drafts:[],fp:[],finishY:4000,maxY:0,collected:0,L:1,daily:false,rmMode:'fly',regrow:0,finalT:0,n0:0,zone:1,endT:0,prevCy:0,combo:0,shield:0,pump:0,chase:null,shake:0,slow:0,flash:0,flashC:'255,255,255',para:false,mood:'calm',moodT:0,tipQ:{},seenRow:false,bestH:0};

function makeObs(t,x,y,R,L){
  const sp=1+Math.min(1,(L-1)/20)*.6;
  switch(t){
    case 'bird':case 'gull':return{t:'bird',x,y,y0:y,vx:(R()<.5?-1:1)*(80+R()*50)*sp,ph:R()*6,cd:0,sz:t==='gull'?1.1:1,col:t==='gull'?'#f4f6fb':'#6b4a35',wing:t==='gull'?'#c9d3e6':'#4a3424'};
    case 'eagle':return{t:'bird',eagle:true,x,y,y0:y,vx:(R()<.5?-1:1)*(130+R()*60)*sp,ph:R()*6,cd:0,sz:1.6,col:'#5a3b22',wing:'#3d2715'};
    case 'spike':return{t:'spike',x:clamp(x,110,290),y,len:120+R()*50,a:R()*6,w:(R()<.5?-1:1)*(0.9+R()+L*0.04)};
    case 'storm':return{t:'storm',x:clamp(x,100,300),y,rx:95,ry:46,ph:R()*6,z:0};
    case 'snow':return{t:'storm',snow:true,x:clamp(x,100,300),y,rx:100,ry:48,ph:R()*6,z:0};
    case 'kite':return{t:'kite',ax:clamp(x,90,310),x,y,amp:70+R()*40,spd:1+R()*.8,ph:R()*6,col:PAL[Math.floor(R()*8)]};
    case 'drone':return{t:'drone',x0:40+R()*60,x1:300+R()*60,x,y,spd:.8+R()*.7*sp,ph:R()*6};
    case 'plane':return{t:'plane',x:-999,y,dir:R()<.5?1:-1,per:3.6+R()*1.5,ph:R()*4};
    case 'meteor':return{t:'meteor',x0:120+R()*160,x:-999,y:-1e5,y0:y,dir:R()<.5?1:-1,per:2.8+R()*1.2,ph:R()*3};
  }
}
function genLevel(L,seed,daily){
  const R=rng(seed),W=worldOf(L),wi=wIdx(L),D=Math.min(1.4,(L-1)/20);
  G.rows=[];G.obs=[];G.coins=[];G.winds=[];G.drafts=[];G.fp=[];
  const nRows=Math.min(6+Math.floor(L*0.5),16),gap=600;
  let en=12+3*save.up.start,y=560;
  for(let i=0;i<nRows;i++){
    let A,B,risk=false;const k=R();
    if(i===0){A=['+',6+Math.floor(L/2)+Math.floor(R()*4)];B=['-',3+Math.floor(R()*3)];}
    else if(k<0.3||(en<16&&k<0.6)){A=R()<.5?['+',Math.max(4,Math.round(en*(0.3+R()*0.5)))]:['×',2];B=(R()<.55||en<14)?['-',Math.max(3,Math.round(en*(0.3+R()*0.35)))]:['÷',2];}
    else if(k<0.58){A=['×',2];B=['+',Math.max(5,Math.round(en*(0.6+R()*0.8)))];}
    else if(k<0.78&&en>=30&&L>=3&&i>1){A=['÷',2];B=['-',Math.max(4,Math.round(en*(0.35+R()*0.3)))];}
    else if(L>=3){A=['×',3];B=['+',Math.max(5,Math.round(en*(0.3+R()*0.3)))];risk=true;}
    else{A=['+',Math.max(5,Math.round(en*0.5))];B=['-',Math.max(3,Math.round(en*0.4))];}
    const ra=applyNum(A,en),rb=applyNum(B,en);
    let gates=[{op:A[0],v:A[1]},{op:B[0],v:B[1]}],better=ra>=rb?0:1;
    if(R()<.5){gates.reverse();better=1-better;}
    const row={y,gates,mv:null,used:false,flash:0};
    if(L>=2&&i>0&&R()<0.2){const sp=['?','K','S'][Math.floor(R()*3)];row.gates=[gates[0],{op:sp,v:0},gates[1]];}
    else if(L>=3&&i>0&&R()<0.15+D*0.2)row.mv={amp:50+R()*60,spd:.8+R()*.8,ph:R()*6};
    if(L>=6&&i>0&&R()<0.2){const g=row.gates[R()<.5?0:row.gates.length-1];if('+-×÷'.includes(g.op)){g.alt=isGood(g.op)?['-',Math.max(3,Math.round(en*.4))]:['+',Math.max(5,Math.round(en*.5))];g.per=1.3+R()*.7;g.ph=R()*3;}}
    G.rows.push(row);
    en=clamp(Math.round(Math.max(ra,rb)*0.85),10,800);
    const bx=better===0?100:300;
    if(i>0&&(risk||(L>=2&&R()<0.22+D*0.2))){const t=W.obs[Math.floor(R()*W.obs.length)];const o=makeObs(t==='plane'||t==='meteor'?'spike':t,bx,y+170,R,L);if(o.t==='spike'||o.t==='storm'||o.t==='kite')o.x=o.ax=bx;G.obs.push(o);}
    const cnt=L===1?(R()<.5?1:0):1+(R()<D*0.6?1:0);
    for(let c=0;c<cnt;c++){const t=W.obs[Math.floor(R()*W.obs.length)];G.obs.push(makeObs(t,R()*400,y+330+c*110,R,L));}
    const cx=60+R()*280,cc=4+Math.floor(R()*3);
    for(let c=0;c<cc;c++)G.coins.push({x:clamp(cx+Math.sin(c*0.9)*60,30,370),y:y+90+c*42,taken:false,sp:R()*6});
    if(wi>=1&&R()<0.16){const dx=60+R()*280;G.drafts.push({x0:dx-45,x1:dx+45,y0:y+60,y1:y+gap-80});}
    if(L>=3&&R()<0.2)G.winds.push({y0:y+120,y1:y+gap-80,f:(R()<.5?-1:1)*(170+L*8)});
    y+=gap;
  }
  G.finishY=y+100;
  for(let z=1;z<=9;z++){if(R()<0.75)G.fp.push({t:'tank',x:60+R()*280,y:G.finishY+(z-0.4)*ZH,taken:false});for(let c=0;c<2;c++)G.fp.push({t:'gem',x:40+R()*320,y:G.finishY+(z-1+R())*ZH,taken:false});}
  G.chase=(isChase(L)&&!daily)?{y:-750,v:150+wi*10,cd:0}:null;
}
function gateOp(g){if(!g.alt)return[g.op,g.v];return Math.floor((G.t+g.ph)/g.per)%2===1?g.alt:[g.op,g.v];}
function gateBounds(row){
  const n=row.gates.length;
  if(n===3)return[[0,145],[145,255],[255,400]];
  const off=row.mv?Math.sin(G.t*row.mv.spd+row.mv.ph)*row.mv.amp:0,b=200+off;return[[0,b],[b,400]];
}

  Object.assign(G,{phase:'play',paused:false,t:0,x:200,y:12,vx:0,vy:0,tx:200,n:12+3*save.up.start,bags:3+save.up.bags,esc:[],parts:[],texts:[],sand:[],maxY:12,collected:0,rmMode:'fly',regrow:0,finalT:0,zone:1,endT:0,camY:-40,combo:0,shield:0,pump:0,hitCd:0,shake:0,slow:0,flash:0,para:false,mood:'calm',moodT:0,tipQ:{},seenRow:false});

/* ================= FİZİK ================= */
const DT=1/120;
function windAt(y){for(const w of G.winds)if(y>w.y0&&y<w.y1)return w.f;return 0;}
function draftAt(x,y){for(const d of G.drafts)if(y>d.y0&&y<d.y1&&x>d.x0&&x<d.x1)return 260;return 0;}
function physics(dt){
  G.t+=dt;
  const ph=G.phase,steerOn=ph==='play'||ph==='final'||ph==='end'||ph==='fail';
  if(steerOn){const dir=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);G.tx+=dir*380*dt;}
  G.tx=clamp(G.tx,22,378);
  const r=rho(G.y),n=G.n,M=1+BAGM*G.bags+BM*n,A=2+0.6*Math.pow(n,2/3);
  let ay;
  if(G.para){ay=(-70-G.vy)*3;}
  else ay=(n*LIFT*r-M*G0)/M+draftAt(G.x,G.y)-0.003*A*G.vy*Math.abs(G.vy)/M;
  const kp=9+3*save.up.prop,kd=2*Math.sqrt(kp),st=steerOn?(G.para?.3:1):0;
  const ax=st*((G.tx-G.x)*kp-G.vx*kd)+windAt(G.y)*0.8/M-(st?0:G.vx*2);
  G.vx+=ax*dt;G.vy+=ay*dt;
  const ox=G.x,oy=G.y;
  G.x+=G.vx*dt;G.y+=G.vy*dt;
  if(G.x<18){G.x=18;G.vx=Math.abs(G.vx)*.3;}if(G.x>382){G.x=382;G.vx=-Math.abs(G.vx)*.3;}
  if(G.y<12||ph==='menu'){G.y=12;if(G.vy<0||ph==='menu')G.vy=0;}
  const dx=G.x-ox,dy=G.y-oy;
  const anX=G.x,anY=G.y+34,v=G.vis,sc=Math.min(1.9,Math.pow(r,-1/3)),wind=windAt(G.y+80);
  for(const b of v){
    b.x+=dx*.55;b.px+=dx*.55;b.y+=dy;b.py+=dy;
    const vx=(b.x-b.px)*0.97,vy=(b.y-b.py)*0.97;b.px=b.x;b.py=b.y;
    b.x+=vx+(wind*0.6+Math.sin(G.t*1.3+b.len)*25)*dt*dt;b.y+=vy+420*dt*dt;
    if(b.g<1)b.g=Math.min(1,b.g+dt*5);
  }
  for(let i=0;i<v.length;i++)for(let j=i+1;j<v.length;j++){
    const a=v[i],b=v[j];let ddx=b.x-a.x,ddy=b.y-a.y;const d2=ddx*ddx+ddy*ddy,m=(a.r+b.r)*0.92*sc;
    if(d2<m*m&&d2>1e-4){const d=Math.sqrt(d2),p=(m-d)/d*0.25;ddx*=p;ddy*=p;a.x-=ddx;a.y-=ddy;b.x+=ddx;b.y+=ddy;}
  }
  for(const b of v){const ddx=b.x-anX,ddy=b.y-anY,d=Math.hypot(ddx,ddy);if(d>b.len){b.x=anX+ddx/d*b.len;b.y=anY+ddy/d*b.len;}if(b.y<anY+8)b.y=anY+8;}
  for(const b of v)ropeStep(b,anX,anY,dx,dy,dt,sc);
}

/* ================= ENGEL MANTIĞI ================= */
function obsStep(o,dt){
  switch(o.t){
    case 'bird':o.x+=o.vx*dt;if(o.x>470)o.x=-70;if(o.x<-70)o.x=470;o.y=o.y0+(o.eagle?Math.sin(G.t*1.6+o.ph)*70:Math.sin(G.t*3+o.ph)*6);o.cd-=dt;break;
    case 'spike':o.a+=o.w*dt;break;
    case 'storm':o.z-=dt;break;
    case 'kite':o.x=o.ax+Math.sin(G.t*o.spd+o.ph)*o.amp;break;
    case 'drone':{const s=(Math.sin(G.t*o.spd+o.ph)+1)/2;o.x=o.x0+(o.x1-o.x0)*s;break;}
    case 'plane':{const p=(G.t+o.ph)%o.per;o.warn=p<1;o.x=p<1||p>3?-999:(o.dir>0?-90+(p-1)*290:490-(p-1)*290);break;}
    case 'meteor':{const p=(G.t+o.ph)%o.per;o.warn=p<.9;if(p<.9||p>2.4){o.x=-999;o.y=-1e5;}else{const k=(p-.9)/1.5;o.x=o.x0-o.dir*120+o.dir*k*240;o.y=o.y0+260-k*520;}break;}
  }
}
function obsHits(o,b){
  switch(o.t){
    case 'bird':return o.cd<=0&&Math.hypot(b.x-o.x,b.y-o.y)<b.r+14*o.sz;
    case 'spike':{const ex=Math.cos(o.a)*o.len/2,ey=Math.sin(o.a)*o.len/2,px=b.x-(o.x-ex),py=b.y-(o.y-ey),lx=2*ex,ly=2*ey;let t=(px*lx+py*ly)/(lx*lx+ly*ly);t=clamp(t,0,1);return Math.hypot(px-lx*t,py-ly*t)<b.r+9;}
    case 'storm':return(((b.x-o.x)/o.rx)**2+((b.y-o.y)/o.ry)**2)<1&&Math.random()<DT*2.2*2;
    case 'kite':return Math.hypot(b.x-o.x,b.y-o.y)<b.r+18;
    case 'drone':return Math.abs(b.x-o.x)<b.r+22&&Math.abs(b.y-o.y)<b.r+10;
    case 'plane':return Math.abs(b.x-o.x)<b.r+48&&Math.abs(b.y-o.y)<b.r+12;
    case 'meteor':return Math.hypot(b.x-o.x,b.y-o.y)<b.r+16;
  }
  return false;
}

/* ================= GÜNCELLEME ================= */
function update(dt,rdt){
  const ph=G.phase;
  // görsel balon sayısı
  const tv=Math.min(G.n,MAXV);
  if(G.vis.length>tv){let k=Math.min(G.vis.length-tv,G.rmMode==='fly'?50:3);
    while(k-->0&&G.vis.length>tv){const i=Math.floor(Math.random()*G.vis.length);
      if(G.rmMode==='fly'){const b=G.vis.splice(i,1)[0];b.vy=120+Math.random()*60;b.life=3;G.esc.push(b);}else popVis(i);}}
  G.regrow-=dt;
  if(G.vis.length<tv&&G.regrow<=0){const k=Math.min(tv-G.vis.length,4);for(let i=0;i<k;i++)G.vis.push(newBalloon(G.x+(Math.random()-.5)*30,G.y+60));G.regrow=.04;}

  const c=centroid();
  G.shield=Math.max(0,G.shield-dt);
  if(ph==='play'){
    for(const row of G.rows){
      if(row.used)continue;
      if(!G.seenRow&&row.y-c.y<380&&save.tut<1&&G.L===1){G.seenRow=true;tip('Yeşil kapı balon ekler, kırmızı götürür. Alttaki küçük sayı sonucu gösterir');}
      if(G.prevCy<row.y&&c.y>=row.y){
        row.used=true;const bs=gateBounds(row);
        row.gates.forEach((g,gi)=>{if(c.x<bs[gi][0]||c.x>=bs[gi][1])return;passGate(g,row,c,bs[gi]);});
        if(save.tut<1&&G.L===1&&!G.tipQ.bag){G.tipQ.bag=1;setTimeout(()=>{if(G.phase==='play')tip(matchMedia('(pointer:coarse)').matches?'Sağ alttaki SAFRA düğmesi: kum torbası at, hızla yüksel':'Boşluk ya da ↑: kum torbası at, hızla yüksel');},1200);}
      }
    }
    G.hitCd-=dt;
    if(!G.shield)for(const o of G.obs){obsStep(o,dt);if(G.hitCd>0)continue;for(let i=G.vis.length-1;i>=0;i--){if(obsHits(o,G.vis[i])){hitBalloon(i);G.hitCd=o.t==='storm'?.25:.14;if(o.t==='bird'){o.hits=(o.hits||0)+1;if(o.hits>=2){o.cd=1.5;o.hits=0;o.vx*=1.4;}}if(o.t==='storm'){o.z=.12;tone(90,.15,'square',.05,60);}break;}}}
    else for(const o of G.obs)obsStep(o,dt);
    for(const o of G.obs)if(Math.hypot(o.x-c.x,o.y-c.y)<150&&G.mood!=='happy')setMood('scared',.3);
    // kovalayan kartal
    if(G.chase){const ch=G.chase;if(G.t>3)ch.y+=ch.v*(1+G.t*0.003)*dt;ch.y=Math.max(ch.y,G.y-620);ch.cd-=dt;
      if(ch.y>G.y-30&&ch.cd<=0&&G.vis.length){let lo=0;G.vis.forEach((b,i)=>{if(b.y<G.vis[lo].y)lo=i;});hitBalloon(lo);ch.cd=.3;G.shake=8;setMood('panic',.5);}
      if(ch.y>G.y-260)setMood('panic',.2);}
    // altınlar
    const mr=28+14*save.up.mag;
    for(const co of G.coins){if(co.taken)continue;
      const d1=Math.hypot(co.x-G.x,co.y-G.y),d2=Math.hypot(co.x-c.x,co.y-c.y),d=Math.min(d1,d2),tx=d1<d2?G.x:c.x,ty=d1<d2?G.y:c.y;
      if(d<mr+16){co.x+=(tx-co.x)*Math.min(1,dt*9);co.y+=(ty-co.y)*Math.min(1,dt*9);}
      if(d<22){co.taken=true;sparks(co.x,co.y,'rgba(255,220,90,.9)',7,90);G.collected+=1+Math.floor(G.L/4);tone(1200+Math.random()*200,.09,'sine',.1,1800);}
    }
    if(c.y>=G.finishY){
      G.phase='final';G.n0=G.n;G.finalT=0;G.rmMode='pop';G.chase=null;G.pump=0;
      banner('İnce hava!<small>Hızlı dokun, balonları pompala</small>',1.6);tone(660,.3,'triangle',.15,990);updAct();
      if(save.tut<2&&G.L<=2)setTimeout(()=>tip('Halka küçülüp daireye değdiği anda dokun: Mükemmel pompa!',3.5),1700);
    }
    if(G.n<=0||G.y<G.maxY-480)fail();
  }
  if(ph==='final'||ph==='end'){
    G.finalT+=dt;G.pump=Math.max(0,G.pump-dt*0.32);
    const r=rho(G.y),lt=save.up.latex,ps=1-0.3*G.pump,rmin=(0.08-0.007*lt)*ps,rmax=(0.95-0.035*lt)*ps;
    const frac=clamp((r-rmin)/(rmax-rmin),0,1),target=Math.ceil(G.n0*frac);
    if(ph==='final'&&G.n>target)G.n=target;
    // final pickupları
    for(const p of G.fp){if(p.taken)continue;const d=Math.min(Math.hypot(p.x-G.x,p.y-G.y),Math.hypot(p.x-c.x,p.y-c.y));
      if(d<34){p.taken=true;if(p.t==='tank'){const add=Math.max(3,Math.round(G.n0*0.09));G.n+=add;G.n0+=add;say(p.x,p.y,'+'+add+' helyum','#7ff0ff',true);tone(500,.25,'sine',.15,1100);burst(p.x,p.y,'#7ff0ff',14);}else{G.collected+=5;say(p.x,p.y,'+5','#ffe04a');tone(1500,.12,'sine',.12,2200);burst(p.x,p.y,'#ff7fc8',8);}}}
    const z=clamp(Math.floor((G.y-G.finishY)/ZH)+1,1,10);
    if(z>G.zone&&ph==='final'){G.zone=z;tone(400+z*80,.22,'triangle',.14);tone(600+z*80,.22,'triangle',.1,null,.08);say(G.x,G.y+160,'x'+z,'#ffe04a',true);P({x:G.x,y:G.y+60,vx:0,vy:0,life:.6,col:`hsl(${(z*36)%360},95%,70%)`,sz:40,k:'ring'});sparks(G.x,G.y+60,`hsla(${(z*36)%360},95%,70%,.9)`,18,220);G.slow=.4;G.flash=.7;G.flashC='255,236,120';G.shake=6;setMood('happy',1);}
    if(ph==='final'&&G.finalT>1.2&&(G.vy<-5||G.n<=0)){G.phase='end';G.endT=0;updAct();G.n0=G.n;}
    if(G.phase==='end'){G.endT+=dt;
      if(G.n>0&&G.endT>.5){G.n=Math.max(0,G.n-Math.max(1,Math.ceil(G.n*dt*4)));}
      if(G.n===0&&!G.para){G.para=true;tone(300,.4,'sine',.1,600);}
      if(G.endT>3)showResult(true);}
  }
  if(ph==='fail'){G.endT+=dt;if(G.endT>2.2)showResult(false);}
  G.prevCy=c.y;G.maxY=Math.max(G.maxY,G.y);
  // ruh hali
  G.moodT-=dt;if(G.moodT<=0){G.mood=G.n>0&&G.n<10&&ph==='play'?'panic':'calm';G.moodT=.2;}
  // efektler
  emitFx();
  for(const b of G.esc){b.y+=b.vy*dt;b.x+=Math.sin(G.t*2+b.len)*20*dt;b.life-=dt;}G.esc=G.esc.filter(b=>b.life>0);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='conf'){p.vy-=160*dt;p.vx*=1-2*dt;if(p.vy<-70)p.vy=-70;p.x+=Math.sin(p.rot)*20*dt;}else if(p.k==='smoke'||p.k==='fire'){p.vx*=1-1.5*dt;p.vy=p.vy*(1-1.5*dt)+(p.k==='fire'?60:25)*dt;}else if(p.k!=='ring'&&p.k!=='spark')p.vy-=300*dt;else{p.vx*=1-3*dt;p.vy*=1-3*dt;}p.rot+=p.vr*dt;p.life-=dt;}G.parts=G.parts.filter(p=>p.life>0);
  for(const s of G.sand){s.vy-=600*dt;s.y+=s.vy*dt;s.x+=s.vx*dt;}G.sand=G.sand.filter(s=>s.y>G.camY-200);
  for(const t of G.texts){t.y+=50*dt;t.life-=dt;}G.texts=G.texts.filter(t=>t.life>0);
  for(const row of G.rows)row.flash=Math.max(0,row.flash-dt*1.5);
  G.shake=Math.max(0,G.shake-rdt*25);G.flash=Math.max(0,G.flash-rdt*2.2);G.slow=Math.max(0,G.slow-rdt);
  // kamera
  const lead=(G.phase==='final'||G.phase==='end')?0.32:0.26;
  G.camY+=(G.y-VH*lead-G.camY)*Math.min(1,dt*5);if(G.camY<-40)G.camY=-40;
  // HUD
  if(G.phase!=='menu'){$('cc').textContent=G.collected;$('progf').style.width=clamp(G.y/G.finishY*100,0,100)+'%';
    if(G.chase)$('progc').style.left=clamp(G.chase.y/G.finishY*100,0,100)+'%';}
  const fm=$('mult');fm.hidden=!(G.phase==='final'||G.phase==='end');fm.textContent='x'+G.zone;
  const cb=$('combo');cb.hidden=!(G.combo>=2&&G.phase==='play');cb.textContent='KOMBO x'+G.combo;
}
function passGate(g,row,c,b){
  let [op,val]=gateOp(g);const before=G.n,gx=(b[0]+b[1])/2;
  if(op==='?'){const q=Math.random();[op,val]=q<.3?['×',3]:q<.55?['+',Math.max(10,Math.round(G.n*0.8))]:q<.8?['÷',2]:['-',Math.round(G.n*0.4)+3];say(gx,row.y+80,'? → '+fmtOp(op,val),'#d7c8ff');}
  if(op==='K'){G.shield=7;say(gx,row.y+40,'Kalkan!','#7fd8ff',true);tone(700,.3,'sine',.15,1400);}
  else if(op==='S'){G.bags=Math.min(6,G.bags+1);say(gx,row.y+40,'+1 safra','#ffb36b',true);tone(600,.15,'triangle',.15,900);updAct();}
  else{G.n=Math.min(99999,applyNum([op,val],G.n));}
  g.hit=true;g.hitOp=[op,val];row.flash=1;
  const good=isGood(op),d=G.n-before,col=`rgb(${gateCol(op)})`;
  for(let i=0;i<18;i++){const x=b[0]+Math.random()*(b[1]-b[0]);P({x,y:row.y+(Math.random()-.5)*40,vx:(Math.random()-.5)*120,vy:40+Math.random()*200,life:.6+Math.random()*.5,col,sz:5+Math.random()*5,k:'shard'});}
  P({x:c.x,y:c.y,vx:0,vy:0,life:.45,col,sz:24,k:'ring'});
  if(isGood(op)){confetti(c.x-60,c.x+60,c.y+20,26,180);sparks(c.x,c.y,'rgba(255,255,200,.9)',12);}
  if(op!=='K'&&op!=='S')say(c.x,c.y+40,(d>=0?'+':'−')+Math.abs(d),good?'#4fe08f':'#ff6b7a',true);
  if(good){G.combo++;tone(520,.12,'triangle',.15,900);tone(780,.15,'triangle',.12,1300,.07);G.regrow=0;setMood('happy',1.1);
    if(G.combo>=2){const bonus=G.combo-1;G.collected+=bonus;say(c.x+60,c.y+90,'+'+bonus+' kombo','#ffe04a');tone(990+G.combo*60,.12,'sine',.1,null,.15);}
    if(op==='×'&&val>=3){G.slow=.35;G.flash=.5;G.flashC='120,255,170';}
  }else{G.combo=0;tone(300,.25,'sawtooth',.08,140);G.rmMode='fly';G.shake=7;G.flash=.35;G.flashC='255,90,110';setMood('scared',1);}
}
function fail(){G.phase='fail';G.endT=0;G.n=0;G.rmMode='pop';G.para=true;tone(400,.6,'sawtooth',.08,80);updAct();setMood('panic',3);}

let countAnim=0;
function showResult(ok){
  if(G.phase==='done')return;G.phase='done';updAct();
  $('hud').hidden=true;$('combo').hidden=true;$('mult').hidden=true;
  const base=ok?15+4*G.L:0,mul=ok?G.zone:1;
  let tot=ok?Math.round((base+G.collected)*mul):G.collected;
  const stars=ok?(G.zone>=8?3:G.zone>=5?2:1):0;
  let bonus=0;
  if(G.daily){const di=dailyInfo();if(save.daily.d!==di.k)save.daily={d:di.k,best:0,done:false};if(ok&&!save.daily.done){bonus=100;save.daily.done=true;}save.daily.best=Math.max(save.daily.best,tot+bonus);}
  else if(ok){save.stars[G.L]=Math.max(save.stars[G.L]||0,stars);save.bestH[G.L]=Math.max(save.bestH[G.L]||0,G.maxY-G.finishY);if(G.L===save.level)save.level++;}
  tot+=bonus;save.coins+=tot;store();
  $('rtitle').textContent=ok?(G.daily?'Günlük görev tamam':'Ulaştığın çarpan'):'Balonların bitti!';
  $('rx').textContent=ok?'x'+mul:'Düştün';$('rx').className='res-x'+(ok?'':' fail');
  $('rmul').textContent='x'+mul;$('rbonusRow').hidden=!bonus;$('rbonus').textContent='+'+bonus;
  $('rstars').hidden=!ok||G.daily;
  const sp=[...$('rstars').children];sp.forEach(s=>s.classList.remove('on'));
  sp.forEach((s,i)=>{if(i<stars)setTimeout(()=>{s.classList.add('on');tone(700+i*220,.2,'triangle',.14);},500+i*280);});
  $('next').textContent=ok&&!G.daily?'Sonraki bölüm':'Tekrar dene';
  $('again').hidden=!(ok&&!G.daily);
  $('result').hidden=false;$('next').focus();
  const vals=[['rbase',base],['rcol',G.collected],['rtot',tot]],t0=performance.now();cancelAnimationFrame(countAnim);
  const tick=now=>{const k=clamp((now-t0)/900,0,1),e=1-Math.pow(1-k,3);vals.forEach(([id,v])=>$(id).textContent=Math.round(v*e));if(k<1)countAnim=requestAnimationFrame(tick);};countAnim=requestAnimationFrame(tick);
  if(ok){confetti(0,400,G.camY+VH+20,140,-60);}
  if(ok)[0,90,180,300].forEach((d,i)=>setTimeout(()=>tone(523*Math.pow(1.26,i),.22,'triangle',.12),d));
  G.lastOk=ok;
}

const shade=(col,a)=>css(a>=0?mix(col,[255,255,255],a):mix(col,[0,0,0],-a));

/* ---- gerçekçi işleme yardımcıları: gürültü, bulanıklık, piksel sprite ---- */
const NP=new Uint8Array(512);{const r=rng(1234),p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)NP[i]=p[i&255];}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),X=xi&255,Y=yi&255;
  const a=NP[NP[X]+Y]/255,b=NP[NP[X+1]+Y]/255,c=NP[NP[X]+Y+1]/255,d=NP[NP[X+1]+Y+1]/255;return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s/(1-Math.pow(.5,o));}
function boxBlur(A,W,H,r,passes){let a=A.slice(),b=new Float32Array(A.length);
  for(let p=0;p<passes;p++){for(let y=0;y<H;y++){let s=0;const o=y*W;for(let x=-r;x<=r;x++)s+=a[o+clamp(x,0,W-1)];for(let x=0;x<W;x++){b[o+x]=s/(2*r+1);s+=a[o+clamp(x+r+1,0,W-1)]-a[o+clamp(x-r,0,W-1)];}}
    for(let x=0;x<W;x++){let s=0;for(let y=-r;y<=r;y++)s+=b[clamp(y,0,H-1)*W+x];for(let y=0;y<H;y++){a[y*W+x]=s/(2*r+1);s+=b[clamp(y+r+1,0,H-1)*W+x]-b[clamp(y-r,0,H-1)*W+x];}}}
  return a;}
const norm3=(x,y,z)=>{const l=Math.hypot(x,y,z);return[x/l,y/l,z/l];};
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function pixSprite(key,w,h,scale,fn){let c=SPR.get(key);if(c)return c;const k=S*DPR*scale,W=Math.max(2,Math.ceil(w*k)),H=Math.max(2,Math.ceil(h*k));c=document.createElement('canvas');c.width=W;c.height=H;fn(c,W,H,k);SPR.set(key,c);return c;}

/* ---- balon: gerçek lateks ışıklandırması (yayınık + parlama + fresnel + ışık geçirgenliği) ---- */
function balPath(g,X,Y,R,shape){
  g.beginPath();
  if(shape==='kalp'){g.moveTo(X,Y+R*1.05);g.bezierCurveTo(X-R*1.5,Y-R*.05,X-R*.85,Y-R*1.35,X,Y-R*.5);g.bezierCurveTo(X+R*.85,Y-R*1.35,X+R*1.5,Y-R*.05,X,Y+R*1.05);g.closePath();}
  else if(shape==='yildiz'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?R*.6:R*1.2;g.lineTo(X+Math.cos(a)*q,Y+Math.sin(a)*q);}g.closePath();}
  else if(shape==='kedi'){g.arc(X,Y,R,0,7);g.moveTo(X-R*.92,Y-R*.3);g.lineTo(X-R*.78,Y-R*1.38);g.lineTo(X-R*.2,Y-R*.92);g.closePath();g.moveTo(X+R*.92,Y-R*.3);g.lineTo(X+R*.78,Y-R*1.38);g.lineTo(X+R*.2,Y-R*.92);g.closePath();}
  else{g.moveTo(X,Y-R*1.12);g.bezierCurveTo(X+R*1.3,Y-R*1.12,X+R*1.12,Y+R*.62,X,Y+R*1.1);g.bezierCurveTo(X-R*1.12,Y+R*.62,X-R*1.3,Y-R*1.12,X,Y-R*1.12);g.closePath();}
}
const LGT=norm3(-.45,-.7,.6),HVEC=norm3(LGT[0],LGT[1],LGT[2]+1);
function balSprite(col,shape){return pixSprite('B'+col+shape,52,64,1,(c,W,H,k)=>{
  const g=c.getContext('2d');
  g.save();g.scale(k,k);balPath(g,26,27,16,shape);g.fillStyle='#fff';g.fill();if(shape==='yildiz'){g.lineJoin='round';g.lineWidth=5;g.strokeStyle='#fff';g.stroke();}g.restore();
  const img=g.getImageData(0,0,W,H),d=img.data,N=W*H,A=new Float32Array(N);for(let i=0;i<N;i++)A[i]=d[i*4+3]/255;
  const Hm=boxBlur(A,W,H,Math.max(1,Math.round(16*k*.3)),3);for(let i=0;i<N;i++)Hm[i]=Math.sqrt(Hm[i]);
  const base=hx(col).map(v=>Math.pow(v/255,2.2)),gs=16*k*.55;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x,a=A[i];if(a<=0)continue;
    let nx=(Hm[i-1]-Hm[i+1])*gs,ny=(Hm[i-W]-Hm[i+W])*gs,nz=1;const nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl;
    const nd=nx*LGT[0]+ny*LGT[1]+nz*LGT[2],wrap=Math.max(0,(nd+.3)/1.3),nh=Math.max(0,nx*HVEC[0]+ny*HVEC[1]+nz*HVEC[2]);
    const spec=Math.pow(nh,140)*1.6+Math.pow(nh,18)*.16,fres=Math.pow(1-nz,2.2),trans=Math.max(0,-(nx*LGT[0]+ny*LGT[1]))*fres;
    const ao=1-.3*smooth(.5,1,y/H),win=(nh>.985&&nh<.992)?.25:0;
    for(let ch=0;ch<3;ch++){const b0=base[ch];const v=b0*(.12+1.0*wrap)*ao+Math.pow(b0,.55)*trans*.85+fres*.05+spec+win;d[i*4+ch]=255*Math.pow(clamp(v,0,1),1/2.2);}
    d[i*4+3]=255*a;}
  g.putImageData(img,0,0);
  g.save();g.scale(k,k);const X=26,ky=shape==='klasik'?27+16*1.08:27+16*1.0;
  const kg=g.createLinearGradient(X-4,0,X+4,0);kg.addColorStop(0,shade(col,-.55));kg.addColorStop(.4,shade(col,.15));kg.addColorStop(1,shade(col,-.6));
  g.fillStyle=kg;g.beginPath();g.moveTo(X-1.4,ky-1.5);g.quadraticCurveTo(X-2.2,ky+2.5,X-4.4,ky+4.6);g.quadraticCurveTo(X,ky+3.4,X+4.4,ky+4.6);g.quadraticCurveTo(X+2.2,ky+2.5,X+1.4,ky-1.5);g.closePath();g.fill();
  g.strokeStyle=shade(col,-.5);g.lineWidth=.8;g.beginPath();g.moveTo(X-3.6,ky+4.3);g.quadraticCurveTo(X,ky+3.2,X+3.6,ky+4.3);g.stroke();
  if(shape==='kedi'){const Y=27,R=16;g.fillStyle='rgba(25,15,40,.8)';g.beginPath();g.ellipse(X-R*.34,Y-R*.02,R*.11,R*.15,0,0,7);g.ellipse(X+R*.34,Y-R*.02,R*.11,R*.15,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(X-R*.31,Y-R*.07,R*.04,0,7);g.arc(X+R*.37,Y-R*.07,R*.04,0,7);g.fill();
    g.fillStyle='#ffb3c8';g.beginPath();g.moveTo(X-R*.08,Y+R*.16);g.lineTo(X+R*.08,Y+R*.16);g.lineTo(X,Y+R*.26);g.fill();
    g.strokeStyle='rgba(25,15,40,.55)';g.lineWidth=R*.05;g.beginPath();for(const s2 of [-1,1]){g.moveTo(X+s2*R*.3,Y+R*.22);g.lineTo(X+s2*R*.75,Y+R*.15);g.moveTo(X+s2*R*.3,Y+R*.3);g.lineTo(X+s2*R*.75,Y+R*.36);}g.stroke();}
  g.restore();
});}
function drawBalloon(x,y,r,col,g=1,shape='klasik'){const s=r*g/16;if(s<=.03)return;const k=s*S;ctx.drawImage(balSprite(col,shape),sx(x)-26*k,sy(y)-27*k,52*k,64*k);}

/* ---- hacimli bulutlar: fbm yoğunluk + ışık yönünde örnekleme ---- */
const CT=[[[255,255,255],[146,166,204],[255,248,236]],[[206,200,242],[64,60,118],[255,236,200]],[[138,143,164],[40,43,62],[196,198,222]],[[247,250,255],[158,178,214],[255,255,255]],[[255,242,250],[186,156,218],[255,226,240]]];
function cloudSprite(v,t){return pixSprite('C'+v+'_'+t,240,130,1.1/DPR,(c,W,H)=>{
  const g=c.getContext('2d'),img=g.createImageData(W,H),d=img.data,R=rng(v*97+13),n=5+Math.floor(R()*3),B=[];
  for(let i=0;i<n;i++){const u=i/(n-1),m=Math.sin(u*Math.PI);B.push([.16+u*.68+(R()-.5)*.05,.66-m*(.14+R()*.14),.075+m*(.075+R()*.06)]);}
  for(let i=0;i<3;i++){const u=.3+R()*.4;B.push([u,.5-R()*.12,.09+R()*.05]);}
  const sd=v*17.3+t*3.1,AS=W/H;
  const D=(u,w)=>{let s=0;for(const[bx,by,br] of B){const dx=(u-bx)*AS/1.85,dy=(w-by),r=br*1.0;const q=(dx*dx+dy*dy)/(r*r);if(q<4)s+=Math.max(0,1-q*.25)**2;}s*=smooth(.86,.72,w);return s+(fbm(u*11+sd,w*7+sd,4)-.5)*.42;};
  const [top,shd,rim]=CT[t];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const u=x/W,w=y/H,dd=D(u,w),a=smooth(.32,.5,dd);if(a<=0)continue;
    const o=(D(u-.008,w-.035)+D(u-.016,w-.075)+D(u-.024,w-.12))/3,lit=clamp(1.15-o*1.05,0,1)*(1-.45*smooth(.5,.85,w)),i=(y*W+x)*4;
    const e=clamp((.75-a)*2,0,1)*lit,sh=lit*lit;
    for(let ch=0;ch<3;ch++)d[i+ch]=clamp(shd[ch]+(top[ch]-shd[ch])*(.25+.75*sh)+(rim[ch]-top[ch])*e*.5,0,255);d[i+3]=255*a;}
  g.putImageData(img,0,0);});}
function cloudBlur(v,t){const key='CB'+v+'_'+t;let c=SPR.get(key);if(c)return c;const src=cloudSprite(v,t);c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');try{g.filter='blur(3px)';}catch(e){}g.drawImage(src,0,0);SPR.set(key,c);return c;}
function cloudS(x,y,w,a,v,t=0,blur){if(a<=.01)return;const k=w/240*S;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(blur?cloudBlur(((v%6)+6)%6,t):cloudSprite(((v%6)+6)%6,t),x-120*k,y-84*k,240*k,130*k);ctx.globalAlpha=1;}

/* ---- hasır örgü sepet dokusu ---- */
function wickerSprite(){return pixSprite('wick',40,30,1,(c,W,H,k)=>{
  const g=c.getContext('2d');g.save();g.scale(k,k);g.beginPath();g.moveTo(2,3);g.lineTo(38,3);g.lineTo(35,26);g.quadraticCurveTo(20,30.5,5,26);g.closePath();g.fillStyle='#fff';g.fill();g.restore();
  const img=g.getImageData(0,0,W,H),d=img.data,lo=[92,50,18],hi=[242,196,128];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(!d[i+3])continue;const u=x/k,w=y/k;
    const row=Math.floor(w/3),fy=(w/3)%1,ph=((u/4.4)+row*.5)%1,over=Math.sin(ph*Math.PI*2),strand=Math.sin(fy*Math.PI);
    let lum=.2+.75*Math.pow(strand,.7)*(.7+.3*over);const st=Math.abs(((u/4.4)%1)-.5);if(st<.07)lum-=.25*(1-st/.07)*(over<0?1:.3);
    lum+=(vnoise(u*2.5,w*2.5)-.5)*.3;const cx=(u-20)/19;lum*=(1-.5*cx*cx)*(1-.25*w/30);
    lum=clamp(lum,0,1);for(let ch=0;ch<3;ch++)d[i+ch]=lo[ch]+(hi[ch]-lo[ch])*lum;}
  g.putImageData(img,0,0);});}
/* ---- yumuşak duman sprite'ı ---- */
function puffSprite(){return pixSprite('puff',32,32,.6,(c,W,H)=>{const g=c.getContext('2d'),img=g.createImageData(W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const u=x/W-.5,w=y/H-.5,r=Math.hypot(u,w)*2,n=fbm(x/W*4,y/H*4,3),a=clamp((1-r)*1.4,0,1)*(.55+.45*n);const i=(y*W+x)*4;d[i]=d[i+1]=d[i+2]=255;d[i+3]=255*a*a;}

/* ---- zemin dokuları ---- */
const GTEX={};
function groundTex(kind){if(GTEX[kind])return GTEX[kind];const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),img=g.createImageData(128,128),d=img.data;
  const P={grass:[[60,130,50],[150,215,100]],sand:[[214,176,112],[252,228,170]],snow:[[200,214,240],[255,255,255]],sea:[[25,95,165],[110,200,240]],city:[[18,20,48],[46,50,92]]}[kind];
  for(let y=0;y<128;y++)for(let x=0;x<128;x++){let n=fbm(x/32*4,y/32*4,4);if(kind==='grass')n=n*.6+.4*Math.pow(vnoise(x*.9,y*.25),3);if(kind==='sand')n=n*.7+.3*vnoise(x*.6,y*.6);const i=(y*128+x)*4;for(let ch=0;ch<3;ch++)d[i+ch]=P[0][ch]+(P[1][ch]-P[0][ch])*n;d[i+3]=255;}
  g.putImageData(img,0,0);GTEX[kind]=ctx.createPattern(c,'repeat');return GTEX[kind];}
function texRect(kind,y0,alpha){const p=groundTex(kind);try{p.setTransform(new DOMMatrix([S,0,0,S,0,y0]));}catch(e){}ctx.globalAlpha=alpha;ctx.fillStyle=p;ctx.fillRect(0,y0,CW,CH-y0+20);ctx.globalAlpha=1;}

/* ---- ip fiziği (verlet, yerçekimiyle sarkar) ---- */
const RN=4;
function ropeStep(b,ax,ay,dx,dy,dt,sc){
  const ex=b.x,ey=b.y-b.r*(b.shape==='klasik'?1.18:1.08)*sc*b.g,seg=(b.len*1.03)/(RN+1);
  if(!b.rope){b.rope=[];for(let i=1;i<=RN;i++){const t=i/(RN+1),x=ax+(ex-ax)*t,y=ay+(ey-ay)*t;b.rope.push({x,y,px:x,py:y});}}
  const R=b.rope;
  for(const p of R){p.x+=dx*.8;p.px+=dx*.8;p.y+=dy;p.py+=dy;const vx=(p.x-p.px)*.95,vy=(p.y-p.py)*.95;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy-240*dt*dt;}
  for(let it=0;it<4;it++){
    let qx=ax,qy=ay;
    for(let i=0;i<RN;i++){const p=R[i],ddx=p.x-qx,ddy=p.y-qy,dd=Math.hypot(ddx,ddy)||1e-4;if(dd>seg){const k=(dd-seg)/dd;if(i===0){p.x-=ddx*k;p.y-=ddy*k;}else{const q=R[i-1];q.x+=ddx*k*.5;q.y+=ddy*k*.5;p.x-=ddx*k*.5;p.y-=ddy*k*.5;}}qx=p.x;qy=p.y;}
    for(let i=RN-1;i>=0;i--){const p=R[i],nx=i===RN-1?ex:R[i+1].x,ny=i===RN-1?ey:R[i+1].y,ddx=nx-p.x,ddy=ny-p.y,dd=Math.hypot(ddx,ddy)||1e-4;if(dd>seg){const k=(dd-seg)/dd;p.x+=ddx*k;p.y+=ddy*k;}}
  }
  b.ex=ex;b.ey=ey;
}
function drawRopes(anX,anY){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const pass of [0,1]){ctx.strokeStyle=pass?'rgba(255,255,255,.9)':'rgba(40,40,60,.35)';ctx.lineWidth=pass?Math.max(.7,.9*S):Math.max(1.2,1.8*S);ctx.beginPath();
    for(const b of G.vis){if(!b.rope)continue;const pts=[[anX,anY],...b.rope.map(p=>[sx(p.x),sy(p.y)]),[sx(b.ex),sy(b.ey)]];
      ctx.moveTo(pts[0][0]+(pass?0:.6*S),pts[0][1]);for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;ctx.quadraticCurveTo(pts[i][0]+(pass?0:.6*S),pts[i][1],mx+(pass?0:.6*S),my);}ctx.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);}
    ctx.stroke();}
  // ip demeti düğümü
  const kg=ctx.createRadialGradient(anX-1*S,anY-1*S,.3*S,anX,anY,4*S);kg.addColorStop(0,'#fff');kg.addColorStop(1,'#b8b8c8');ctx.fillStyle=kg;ctx.beginPath();ctx.ellipse(anX,anY,3.2*S,4.2*S,0,0,7);ctx.fill();
}
/* ---- dallanan şimşek ---- */

function lightning(X,Y,len){ctx.save();ctx.globalCompositeOperation='lighter';const seed=Math.random();ctx.beginPath();bolt(X,Y,X+(seed-.5)*40*S,Y+len,len*.45,0);const path=ctx;ctx.shadowColor='rgba(190,170,255,1)';ctx.shadowBlur=22*S;ctx.strokeStyle='rgba(200,180,255,.55)';ctx.lineWidth=6*S;ctx.stroke();ctx.shadowBlur=8*S;ctx.strokeStyle='#ffffff';ctx.lineWidth=1.8*S;ctx.stroke();ctx.restore();}

  if(G.phase!=='menu'&&G.phase!=='done'&&G.n>0){let top=-1e9;for(const b of G.vis)top=Math.max(top,b.y+b.r*sc*1.2);if(top<-1e8)top=G.y+60;
    const X=sx(clamp(c.x,40,360)),Y=sy(top)-24*S,txt=String(G.n);ctx.font=`800 ${24*S}px "Baloo 2",sans-serif`;const w=ctx.measureText(txt).width+28*S;
    const low=G.n<10&&G.phase==='play';ctx.save();ctx.shadowColor='rgba(20,30,70,.3)';ctx.shadowBlur=8*S;ctx.shadowOffsetY=3*S;const bg=ctx.createLinearGradient(0,Y-16*S,0,Y+16*S);bg.addColorStop(0,low?'#ff7a88':'#ffffff');bg.addColorStop(1,low?'#d93347':'#e6ecfa');ctx.fillStyle=bg;rr(X-w/2,Y-16*S,w,32*S,16*S);ctx.fill();ctx.restore();
    ctx.beginPath();ctx.moveTo(X-6*S,Y+15*S);ctx.lineTo(X,Y+22*S);ctx.lineTo(X+6*S,Y+15*S);ctx.fillStyle=low?'#d93347':'#e6ecfa';ctx.fill();
    ctx.fillStyle=low?'#fff':'#1d2b4f';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X,Y+2*S);ctx.textBaseline='alphabetic';}
  for(const t of G.texts){const age=1.2-t.life,sc2=age<.15?1.7-age/.15*.7:1;ctx.globalAlpha=Math.min(1,t.life*1.5);const fs=(t.big?34:20)*S*sc2;ctx.font=`800 ${fs}px "Baloo 2",sans-serif`;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=6*S;ctx.strokeStyle='rgba(29,43,79,.7)';const X=sx(t.x),Y=sy(t.y);ctx.strokeText(t.txt,X,Y);const tg=ctx.createLinearGradient(0,Y-fs*.7,0,Y+fs*.2);tg.addColorStop(0,'#ffffff');tg.addColorStop(.55,t.col);tg.addColorStop(1,t.col);ctx.fillStyle=tg;ctx.fillText(t.txt,X,Y);}ctx.globalAlpha=1;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G._sun)lensFlare(G._sun[0],G._sun[1],1-hi);
  vignette();
  if(G.flash>0){ctx.fillStyle=`rgba(${G.flashC},${G.flash*.35})`;ctx.fillRect(0,0,CW,CH);}
}
