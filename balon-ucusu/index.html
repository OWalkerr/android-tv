<title>Balon Uçuşu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Tek ekran oyun: tam ekran canvas + üstte ince HUD + ortada menü kartı. Gökyüzü dünyası, bilinçli olarak tek tema. */
:root{
  --sky:#8fd3ff; --ink:#1d2b4f; --cream:#fff8ec; --good:#2fbf71; --bad:#ef4b5c; --gold:#ffc23d; --muted:#5a6a8f;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;pointer-events:none;font-family:var(--display);font-weight:800}
.chip{background:rgba(255,255,255,.88);border-radius:999px;padding:2px 12px;font-size:17px;box-shadow:0 2px 0 rgba(29,43,79,.15);display:flex;align-items:center;gap:6px;white-space:nowrap}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,var(--gold) 55%,#d08a10);box-shadow:inset 0 0 0 2px #e0a020;display:inline-block}
#prog{flex:1;height:10px;background:rgba(255,255,255,.55);border-radius:99px;overflow:hidden;min-width:40px}
#progf{height:100%;width:0;background:linear-gradient(90deg,#ff7fc8,#ffb03b);border-radius:99px}
#mult{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 48px);transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:56px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none;line-height:1}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,40,90,.18)}
.card{background:var(--cream);border-radius:22px;padding:20px 20px 18px;width:min(380px,100%);box-shadow:0 8px 0 rgba(29,43,79,.18),0 20px 50px rgba(29,43,79,.25);display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 20px);overflow:auto}
h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:.95;margin:0;text-align:center;letter-spacing:-.5px;text-wrap:balance}
h1 span{color:var(--bad)}
.sub{text-align:center;color:var(--muted);font-weight:700;margin:-4px 0 0}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
button{font-family:var(--display);font-weight:800;border:0;cursor:pointer;border-radius:14px;color:#fff;background:var(--good);font-size:24px;padding:10px 18px;box-shadow:0 5px 0 #1f8a50;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #1f8a50}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
button.big{width:100%;font-size:30px}
.shop{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;background:#fff;border-radius:14px;padding:8px 10px}
.it b{font-family:var(--display);font-size:18px;line-height:1.1}
.it small{color:var(--muted);font-weight:700;grid-column:1;font-size:13px}
.it button{grid-row:1/3;grid-column:2;font-size:17px;padding:6px 12px;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #c98d12;display:flex;align-items:center;gap:5px}
.it button[disabled]{background:#d9dce6;box-shadow:0 4px 0 #b4b9c8;color:#7c859d;cursor:default}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:#e1e4ee}.dots i.on{background:#ff7fc8}
.hint{font-size:13px;color:var(--muted);text-align:center;font-weight:700;margin:0}
.res-x{font-family:var(--display);font-weight:800;font-size:84px;line-height:.9;text-align:center;color:var(--bad)}
.res-x.ok{color:#ff8a3d}
.stat{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:2px 4px;font-variant-numeric:tabular-nums}
.stat.tot{font-family:var(--display);font-size:24px;border-top:2px dashed #e2d8c6;padding-top:8px}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>

<canvas id="c"></canvas>
<div id="hud" hidden>
  <div class="chip" id="lvl">Seviye 1</div>
  <div id="prog"><div id="progf"></div></div>
  <div class="chip"><span class="coin"></span><span id="cc">0</span></div>
</div>
<div id="mult" hidden>x1</div>

<div class="ov" id="menu">
  <div class="card">
    <h1>Balon<br><span>Uçuşu</span></h1>
    <p class="sub" id="msub">Seviye 1</p>
    <div class="row"><div class="chip" style="font-family:var(--display);font-weight:800"><span class="coin"></span><span id="mc">0</span></div></div>
    <button class="big" id="play">Uç!</button>
    <div class="shop" id="shop"></div>
    <p class="hint">Sürükle ya da ← → tuşlarıyla yön ver. Yeşil kapılar balon ekler, kırmızılar götürür. Finişten sonra hava incelir, balonlar şişip patlar: ne kadar yükselirsen çarpan o kadar büyür.</p>
  </div>
</div>

<div class="ov" id="result" hidden>
  <div class="card">
    <p class="sub" id="rtitle">Ulaştığın çarpan</p>
    <div class="res-x" id="rx">x1</div>
    <div class="stat"><span>Seviye ödülü</span><span id="rbase">0</span></div>
    <div class="stat"><span>Toplanan altın</span><span id="rcol">0</span></div>
    <div class="stat"><span>Çarpan</span><span id="rmul">x1</span></div>
    <div class="stat tot"><span>Kazanç</span><span><span class="coin"></span> <span id="rtot">0</span></span></div>
    <button class="big" id="next">Devam</button>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const WW=400, MAXV=50, G0=600, LIFT=90, BM=0.004, HS=2400, ZH=520;
let CW,CH,DPR,S,OX,VH;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);CW=innerWidth;CH=innerHeight;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);S=Math.min(CW/WW,CH/640);OX=(CW-WW*S)/2;VH=CH/S;}
addEventListener('resize',resize);resize();
const sx=x=>OX+x*S, sy=y=>CH-(y-G.camY)*S;

/* ---------- kayıt ---------- */
const KEY='balon-ucusu-v1';
let save={coins:0,level:1,up:{start:0,latex:0,prop:0,mag:0}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.up)save=Object.assign(save,s);}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const UPS=[
 {id:'start',name:'Başlangıç balonu',desc:l=>`${12+3*l} balonla kalk`,base:40,g:1.5,max:15},
 {id:'latex',name:'Dayanıklı lateks',desc:()=>'İnce havada daha geç patlar',base:70,g:1.65,max:8},
 {id:'prop',name:'Pervane',desc:()=>'Sepet daha çevik döner',base:35,g:1.55,max:6},
 {id:'mag',name:'Altın mıknatısı',desc:()=>'Yakındaki altınları çeker',base:50,g:1.6,max:6}];
const cost=u=>Math.round(u.base*Math.pow(u.g,save.up[u.id]));

/* ---------- ses ---------- */
let AC=null,lastPop=0;
function au(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null}}
function tone(f,d,type='sine',v=.15,f2){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}
function popS(){if(!AC)return;const now=performance.now();if(now-lastPop<45)return;lastPop=now;const t=AC.currentTime,len=.08,b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=900+Math.random()*900;s.buffer=b;g.gain.value=.35;s.connect(f).connect(g).connect(AC.destination);s.start(t);}

/* ---------- rastgele ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const PAL=['#ff5a6e','#ffb03b','#ffe04a','#4fd08a','#3fb6ff','#9b7bff','#ff7fc8','#ff8a3d'];

/* ---------- oyun durumu ---------- */
const G={phase:'menu',camY:-40,t:0,x:200,y:12,vx:0,vy:0,tx:200,n:12,vis:[],esc:[],parts:[],texts:[],rows:[],obs:[],coins:[],winds:[],finishY:4000,maxY:0,collected:0,L:1,rmMode:'fly',regrow:0,finalT:0,n0:0,zone:1,endT:0,prevCy:0};

function genLevel(L){
  const R=rng(L*7919+13);
  G.rows=[];G.obs=[];G.coins=[];G.winds=[];
  const nRows=Math.min(5+L,15), gap=640;
  let y=560;
  const good=()=>R()<0.55?['+',Math.round(4+R()*8+L*1.5)]:['×',(L>=3&&R()<0.25)?3:2];
  const bad=()=>R()<0.55?['-',Math.round(4+R()*7+L*2)]:['÷',(L>=4&&R()<0.3)?3:2];
  for(let i=0;i<nRows;i++){
    let a,b,k=R();
    if(i===0){a=['+',Math.round(6+L)];b=['-',4+L];}
    else if(k<0.5){a=good();b=bad();}
    else if(k<0.78){a=good();b=good();if(a[0]===b[0])b=a[0]==='+'?['×',2]:['+',Math.round(10+L*3)];}
    else if(L>=2){a=bad();b=bad();if(a[0]===b[0])b=a[0]==='-'?['÷',2]:['-',Math.round(6+L*2)];}
    else {a=good();b=bad();}
    if(R()<0.5)[a,b]=[b,a];
    const row={y,used:false,gates:[{x0:28,x1:186,op:a[0],v:a[1]},{x0:214,x1:372,op:b[0],v:b[1]}],move:null,flash:0};
    if(L>=2&&i>0&&R()<0.22+L*0.02)row.move={amp:40+R()*50,spd:0.9+R()*0.9,ph:R()*6};
    if(L>=4&&i>0&&R()<0.25){const gt=row.gates[R()<.5?0:1];gt.alt=isGood(gt.op)?bad():good();gt.per=1.4+R()*0.8;gt.ph=R()*3;}
    G.rows.push(row);
    // altınlar: kapılar arası yay
    const cx=60+R()*280,ccount=4+Math.floor(R()*3);
    for(let c=0;c<ccount;c++)G.coins.push({x:Math.max(30,Math.min(370,cx+Math.sin(c*0.9)*60)),y:y+150+c*48,taken:false,sp:R()*6});
    // engeller
    const oy=y+gap*0.55;
    if(i<nRows-1||true){
      const cnt=L===1?(R()<0.55?1:0):1+(R()<Math.min(0.6,L*0.07)?1:0);
      for(let c=0;c<cnt;c++){
        const types=['bird'];if(L>=2)types.push('spike');if(L>=3)types.push('storm');
        const t=types[Math.floor(R()*types.length)], yy=oy+c*110;
        if(t==='bird')G.obs.push({t,x:R()*400,y:yy,vx:(R()<.5?-1:1)*(70+L*10+R()*40),ph:R()*6,cd:0});
        if(t==='spike')G.obs.push({t,x:110+R()*180,y:yy,len:120+R()*50,a:R()*6,w:(R()<.5?-1:1)*(0.9+R()+L*0.05)});
        if(t==='storm')G.obs.push({t,x:R()<.5?105:295,y:yy,rx:95,ry:46,ph:R()*6,z:0});
      }
      if(L>=2&&R()<0.3)G.winds.push({y0:y+120,y1:y+gap-80,f:(R()<.5?-1:1)*(170+L*12)});
    }
    y+=gap;
  }
  G.finishY=y+120;
}
const isGood=op=>op==='+'||op==='×';
function gateOp(g){if(!g.alt)return[g.op,g.v];const on=Math.floor((G.t+g.ph)/g.per)%2===1;return on?g.alt:[g.op,g.v];}
const fmt=(op,v)=>(op==='-'?'−':op)+v;

function newBalloon(x,y){const r=12+Math.random()*4;return{x,y,px:x,py:y,r,col:PAL[Math.floor(Math.random()*PAL.length)],len:55+Math.random()*60,g:0};}
function startLevel(){
  G.L=save.level;genLevel(G.L);
  Object.assign(G,{phase:'play',t:0,x:200,y:12,vx:0,vy:0,tx:200,n:12+3*save.up.start,vis:[],esc:[],parts:[],texts:[],maxY:12,collected:0,rmMode:'fly',regrow:0,finalT:0,zone:1,endT:0,camY:-40});
  for(let i=0;i<Math.min(G.n,MAXV);i++){const b=newBalloon(200+(Math.random()-.5)*60,60+Math.random()*60);b.g=1;G.vis.push(b);}
  G.prevCy=centroid().y;
  $('menu').hidden=true;$('result').hidden=true;$('hud').hidden=false;$('lvl').textContent='Seviye '+G.L;
}
function centroid(){const v=G.vis;if(!v.length)return{x:G.x,y:G.y+90};let x=0,y=0;for(const b of v){x+=b.x;y+=b.y;}return{x:x/v.length,y:y/v.length};}
function rho(y){return y>G.finishY?Math.exp(-(y-G.finishY)/HS):1;}

/* ---------- efektler ---------- */
function burst(x,y,col){for(let i=0;i<9;i++){const a=Math.random()*6.28,s=60+Math.random()*160;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.3,col,sz:3+Math.random()*3});}}
function say(x,y,txt,col,big){G.texts.push({x,y,txt,col,life:1.2,big});}
function popVis(i){const b=G.vis[i];G.vis.splice(i,1);burst(b.x,b.y,b.col);popS();}
function hitBalloon(i){const unit=Math.max(1,Math.round(G.n/G.vis.length));G.n=Math.max(0,G.n-unit);G.rmMode='pop';popVis(i);G.regrow=.35;}

/* ---------- girdi ---------- */
const keys={};let drag=null;
addEventListener('keydown',e=>{keys[e.key]=true;au();
  if(!$('menu').hidden||!$('result').hidden){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){const bs=[...document.querySelectorAll('.ov:not([hidden]) button:not([disabled])')];if(bs.length){let i=bs.indexOf(document.activeElement);i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[i].focus();e.preventDefault();}}
  }
  if(e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key]=false;});
cv.addEventListener('pointerdown',e=>{au();drag={x:e.clientX,tx:G.tx};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(drag)G.tx=drag.tx+(e.clientX-drag.x)/S*1.25;});
const endDrag=()=>drag=null;cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* ---------- fizik ---------- */
const DT=1/120;
function windAt(y){for(const w of G.winds)if(y>w.y0&&y<w.y1)return w.f;return 0;}
function physics(dt){
  G.t+=dt;
  const ph=G.phase, inFinal=ph==='final'||ph==='end';
  if(ph==='play'||inFinal){
    const dir=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);
    G.tx+=dir*380*dt;
  }
  G.tx=Math.max(22,Math.min(378,G.tx));
  const r=rho(G.y), n=G.n, M=1+BM*n, A=2+0.6*Math.pow(n,2/3);
  let ay;
  if(ph==='fail'||ph==='menu'&&n===0)ay=-G0-0.003*A*G.vy*Math.abs(G.vy)/M;
  else ay=(n*LIFT*r-M*G0)/M-0.003*A*G.vy*Math.abs(G.vy)/M;
  const kp=9+3*save.up.prop, kd=2*Math.sqrt(kp);
  const steer=(ph==='play'||inFinal)?1:0;
  let ax=steer*((G.tx-G.x)*kp-G.vx*kd)+windAt(G.y)*0.8/M - (steer?0:G.vx*2);
  G.vx+=ax*dt;G.vy+=ay*dt;
  const ox=G.x,oy=G.y;
  G.x+=G.vx*dt;G.y+=G.vy*dt;
  if(G.x<18){G.x=18;G.vx=Math.abs(G.vx)*.3;}if(G.x>382){G.x=382;G.vx=-Math.abs(G.vx)*.3;}
  if(G.y<12||ph==='menu'){G.y=12;if(G.vy<0||ph==='menu')G.vy=0;}
  const dx=G.x-ox,dy=G.y-oy;
  // görsel balonlar: sepetle birlikte taşınır, yerel ip + kaldırma + itişme
  const anX=G.x,anY=G.y+34,v=G.vis,sc=Math.min(1.9,Math.pow(r,-1/3));
  const wind=windAt(G.y+80);
  for(const b of v){
    b.x+=dx*.55;b.px+=dx*.55;b.y+=dy;b.py+=dy;
    const vx=(b.x-b.px)*0.97,vy=(b.y-b.py)*0.97;b.px=b.x;b.py=b.y;
    b.x+=vx+(wind*0.6+Math.sin(G.t*1.3+b.len)*25)*dt*dt;b.y+=vy+420*dt*dt;
    if(b.g<1)b.g=Math.min(1,b.g+dt*4);
  }
  for(let i=0;i<v.length;i++)for(let j=i+1;j<v.length;j++){
    const a=v[i],b=v[j];let ddx=b.x-a.x,ddy=b.y-a.y;const d2=ddx*ddx+ddy*ddy,m=(a.r+b.r)*0.92*sc;
    if(d2<m*m&&d2>1e-4){const d=Math.sqrt(d2),p=(m-d)/d*0.25;ddx*=p;ddy*=p;a.x-=ddx;a.y-=ddy;b.x+=ddx;b.y+=ddy;}
  }
  for(const b of v){const ddx=b.x-anX,ddy=b.y-anY,d=Math.hypot(ddx,ddy);if(d>b.len){b.x=anX+ddx/d*b.len;b.y=anY+ddy/d*b.len;}if(b.y<anY+8)b.y=anY+8;}
}

function update(dt){
  const ph=G.phase;
  // görsel balon sayısını gerçek sayıya eşitle
  const tv=Math.min(G.n,MAXV);
  if(G.vis.length>tv){let k=Math.min(G.vis.length-tv,G.rmMode==='fly'?50:3);
    while(k-->0&&G.vis.length>tv){const i=Math.floor(Math.random()*G.vis.length);
      if(G.rmMode==='fly'){const b=G.vis.splice(i,1)[0];b.vy=120+Math.random()*60;b.life=3;G.esc.push(b);}else popVis(i);}}
  G.regrow-=dt;
  if(G.vis.length<tv&&G.regrow<=0){const k=Math.min(tv-G.vis.length,4);for(let i=0;i<k;i++){const b=newBalloon(G.x+(Math.random()-.5)*30,G.y+60);G.vis.push(b);}G.regrow=.04;}

  const c=centroid();
  if(ph==='play'){
    // kapılar
    for(const row of G.rows){
      if(row.used)continue;
      if(G.prevCy<row.y&&c.y>=row.y){
        row.used=true;const off=row.move?Math.sin(G.t*row.move.spd+row.move.ph)*row.move.amp:0;
        for(const g of row.gates){if(c.x>=g.x0+off&&c.x<=g.x1+off){
          const [op,val]=gateOp(g);const before=G.n;
          if(op==='+')G.n+=val;if(op==='-')G.n=Math.max(0,G.n-val);if(op==='×')G.n*=val;if(op==='÷')G.n=Math.floor(G.n/val);
          G.n=Math.min(G.n,99999);g.hit=true;row.flash=1;g.hitOp=[op,val];
          const d=G.n-before;
          say(c.x,c.y+40,(d>=0?'+':'−')+Math.abs(d),isGood(op)?'#2fbf71':'#ef4b5c',true);
          if(isGood(op)){tone(520,.12,'triangle',.15,900);setTimeout(()=>tone(780,.15,'triangle',.12,1300),70);G.regrow=0;}else{tone(300,.25,'sawtooth',.08,140);G.rmMode='fly';}
        }}
      }
    }
    // engeller
    for(const o of G.obs){
      if(o.t==='bird'){o.x+=o.vx*dt;if(o.x>460)o.x=-60;if(o.x<-60)o.x=460;o.cd-=dt;
        if(o.cd<=0)for(let i=G.vis.length-1;i>=0;i--){const b=G.vis[i];if(Math.hypot(b.x-o.x,b.y-o.y)<b.r+14){hitBalloon(i);o.cd=.12;break;}}}

function fail(){G.phase='fail';G.endT=0;G.n=0;G.rmMode='pop';tone(400,.6,'sawtooth',.08,80);}

function showResult(ok){
  if(!$('result').hidden)return;
  G.phase='done';
  const base=ok?10+3*G.L:0, mul=ok?G.zone:1, tot=ok?Math.round((base+G.collected)*mul):G.collected;

  $('rx').textContent=ok?'x'+mul:'Düştün';$('rx').className='res-x'+(ok?' ok':'');

  $('next').textContent=ok?'Devam':'Tekrar dene';

  // sayaç
  if(G.phase!=='menu'&&G.phase!=='done'){const c=centroid();let top=-1e9;for(const b of G.vis)top=Math.max(top,b.y+b.r*sc);if(top<-1e8)top=G.y+60;
    const X=sx(Math.max(40,Math.min(360,c.x))),Y=sy(top)-26*S,txt=String(G.n);ctx.font=`800 ${24*S}px "Baloo 2",sans-serif`;const w=ctx.measureText(txt).width+26*S;
    ctx.fillStyle=G.n<8?'#ef4b5c':'#fff';rr(X-w/2,Y-16*S,w,32*S,16*S);ctx.fill();ctx.fillStyle=G.n<8?'#fff':'#1d2b4f';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,X,Y+2*S);ctx.textBaseline='alphabetic';}
  // uçan yazılar
  for(const t of G.texts){ctx.globalAlpha=Math.min(1,t.life*1.5);ctx.font=`800 ${(t.big?34:20)*S}px "Baloo 2",sans-serif`;ctx.textAlign='center';ctx.lineWidth=5*S;ctx.strokeStyle='rgba(29,43,79,.6)';ctx.strokeText(t.txt,sx(t.x),sy(t.y));ctx.fillStyle=t.col;ctx.fillText(t.txt,sx(t.x),sy(t.y));}ctx.globalAlpha=1;
}

/* ---------- döngü ---------- */
let last=performance.now(),acc=0;
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(!document.hidden){acc+=dt;while(acc>=DT){physics(DT);acc-=DT;}update(dt);}
  draw();requestAnimationFrame(frame);
}
showMenu();$('play').focus();
requestAnimationFrame(frame);
})();
</script>
