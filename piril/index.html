:root{

  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;pointer-events:none}
#hearts{display:flex;gap:4px}
#hearts svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(255,138,122,.6))}
#hearts svg.off{filter:none;opacity:.35}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(10,18,22,.55);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:800;font-size:15px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.mote{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--glow) 45%,rgba(255,233,168,0) 75%);box-shadow:0 0 10px var(--glow)}
#chap{margin-left:auto;font-family:var(--title);font-style:italic;font-weight:500;font-size:15px;color:var(--ink-dim)}
#pauseB{pointer-events:auto}
.ib{font:800 14px var(--ui);color:var(--ink);background:rgba(10,18,22,.55);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
#lore{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);width:min(520px,calc(100% - 40px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-family:var(--title);font-style:italic;font-size:17px;line-height:1.45;text-align:center;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;font-family:var(--title);font-weight:800;font-size:34px;text-shadow:0 0 24px rgba(255,233,168,.55),0 3px 0 rgba(0,0,0,.4);width:calc(100% - 32px);animation:tin .6s ease-out}
#toast small{display:block;font-family:var(--ui);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:4px}
@keyframes tin{from{opacity:0;transform:translate(-50%,-40%)}}
/* dokunmatik kontroller: sol yarıda yüzen çubuk, sağda büyük düğmeler */
#tc{position:fixed;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:52%;height:62%;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:118px;height:118px;transform:translate(-50%,0);border-radius:50%;border:2px solid rgba(243,234,216,.22);background:radial-gradient(circle,rgba(243,234,216,.06),rgba(10,18,22,.25));pointer-events:none;opacity:.55;transition:opacity .15s}
#stick.act{transform:translate(-50%,-50%);opacity:1;border-color:rgba(255,233,168,.45)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 35%,rgba(255,250,235,.55),rgba(243,234,216,.18));box-shadow:0 0 18px rgba(255,233,168,.25)}
#btns{position:absolute;right:0;bottom:0;width:210px;height:200px;pointer-events:none;margin-right:env(safe-area-inset-right,0px);margin-bottom:env(safe-area-inset-bottom,0px)}
.tb{position:absolute;border-radius:50%;border:2px solid rgba(243,234,216,.28);background:radial-gradient(circle at 40% 32%,rgba(255,255,255,.16),rgba(10,18,22,.42));color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:800 11px var(--ui);letter-spacing:.06em;touch-action:none;pointer-events:auto;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:transform .06s}
.tb::after{content:'';position:absolute;inset:-14px;border-radius:50%}
.tb svg{width:30px;height:30px}
.tb.on{transform:scale(.92);background:radial-gradient(circle,rgba(255,233,168,.5),rgba(10,18,22,.5));border-color:rgba(255,233,168,.7)}
#bJump{right:20px;bottom:30px;width:96px;height:96px;border-color:rgba(255,233,168,.5)}
#bAtk{right:128px;bottom:64px;width:76px;height:76px}
#bSlide{right:42px;bottom:140px;width:54px;height:54px;font-size:10px}
/* örtüler */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 45%,rgba(5,12,14,.15),rgba(5,12,14,.75))}
.card{width:min(440px,100%);max-height:calc(100% - 10px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:cin .45s ease-out}
.card>*{flex-shrink:0}

h1{font-family:var(--title);font-weight:800;font-size:58px;line-height:.9;margin:0;text-align:center;letter-spacing:-.01em;color:#fff4d6;text-shadow:0 0 30px rgba(255,233,168,.45)}
h1 em{display:block;font-weight:500;font-size:24px;color:var(--ink-dim);margin-top:8px;letter-spacing:.02em}
h2{font-family:var(--title);font-weight:800;font-size:30px;margin:0;text-align:center;text-wrap:balance}
.eyebrow{text-align:center;font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin:0}
.story{font-family:var(--title);font-size:20px;line-height:1.5;text-align:center;margin:0;min-height:5.5em;text-wrap:pretty}
button.b{font:800 18px var(--ui);color:#1b1408;background:linear-gradient(180deg,#fff1c2,#f2c66a);border:0;border-radius:12px;padding:11px 18px;cursor:pointer;box-shadow:0 4px 0 #a8792a,0 0 24px rgba(255,214,120,.25)}
button.b:active{transform:translateY(2px);box-shadow:0 2px 0 #a8792a}
button.g{background:rgba(243,234,216,.08);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
button:focus-visible,.ib:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
button[disabled]{opacity:.4;cursor:default}
.col{display:flex;flex-direction:column;gap:8px}
.chs{display:grid;grid-template-columns:1fr;gap:6px}
.chs button{text-align:left;display:flex;justify-content:space-between;align-items:center}
.chs small{font-weight:600;opacity:.7}
.hint{font-size:13px;color:var(--ink-dim);text-align:center;margin:0;line-height:1.45}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;color:var(--ink-dim)}
.keys h3{grid-column:1/3;margin:8px 0 0;font:800 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--glow)}
.opt{display:flex;justify-content:space-between;align-items:center;text-align:left}
.opt small{font-weight:800;color:var(--glow)}
.keys b{color:var(--ink);font-weight:800}
.dots{display:flex;justify-content:center;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--glow)}
@media (prefers-reduced-motion:reduce){.card,#toast{animation:none}}

  if(P.abuf>0&&P.atkCD<=0&&!P.vine){P.abuf=0;P.atk=.2;P.atkCD=.28;P.atkHit=[];P.atkDir=P.adir||((keys.down&&!P.ground)?'down':keys.up?'up':'side');SFX.swing();if(P.slide>0)P.slide=0;}

  if(P.vine){
    const vc=Math.floor(cx/TS)*TS+16;P.x+=(vc-9-P.x)*Math.min(1,dt*20);

    const above=cell(Math.floor(cx/TS),Math.floor((cy-14)/TS)),below=cell(Math.floor(cx/TS),Math.floor((P.y+P.h+2)/TS));
    if(vy<0&&above!=='|'&&cell(Math.floor(cx/TS),Math.floor(cy/TS))!=='|')vy=0;
    if(vy<0&&above!=='|'&&cy%TS<4)vy=0;

    if(cell(Math.floor((P.x+9)/TS),Math.floor((P.y+13)/TS))!=='|'&&!(vy<=0&&cell(Math.floor((P.x+9)/TS),Math.floor((P.y+20)/TS))==='|'))P.vine=false;
    P.side=dir&&!keys.up&&!keys.down?(P.side||0)+dt:0;

    else if(P.side>.12){P.vine=false;P.vineCD=.3;P.vy=-480;P.vx=dir*230;P.f=dir;P.cut=true;SFX.jump();}
    else if(vy===0&&keys.up){P.topT=(P.topT||0)+dt;if(P.topT>.22){P.vine=false;P.vineCD=.45;P.vy=-430;P.cut=true;P.topT=0;SFX.jump();}}
    else if(onGroundProbe(P)&&keys.down){P.vine=false;}
    P.state='vine';return;}
  // kayma
  if(P.sbuf>0&&P.ground&&P.slide<=0&&P.atk<=0&&(Math.abs(P.vx)>90||keys.slide)){P.sbuf=0;if(dir)P.f=dir;P.slide=.38;setH(P,14);SFX.slide();buzz(10);burst(cx,P.y+P.h,'#cbb89a',6,60);}
  // dal üstünde ↓ basılı tut: aşağı in
  if(P.ground&&keys.down&&Math.abs(P.vx)<60&&onDropable(P)){P.downT=(P.downT||0)+dt;if(P.downT>.22){P.drop=.25;P.y+=2;P.ground=false;P.downT=0;}}else P.downT=0;
  if(P.slide>0){P.slide-=dt;P.vx=P.f*390*(.4+.6*P.slide/.38);if(P.slide<=0||!P.ground){if(!setH(P,26))P.slide=.05;else P.slide=0;}}

  // yatay
  if(P.slide<=0){const tgt=dir*RUN,turn=dir&&Math.sign(P.vx)!==dir,acc=P.ground?(dir?(turn?5200:3400):4400):(dir?2200:700),ctl=P.lock>0?.2:1;P.vx+=clamp(tgt-P.vx,-acc*dt*ctl,acc*dt*ctl);if(dir&&P.lock<=0)P.f=dir;}
  // duvar
  const wl=!!rectHit(P.x-2,P.y+4,2,P.h-10,isSolid),wr=!!rectHit(P.x+P.w,P.y+4,2,P.h-10,isSolid);
  P.wall=0;if(!P.ground&&P.slide<=0&&P.vy>-80&&P.lock<=0){if(wl&&dir<=0)P.wall=-1;else if(wr&&dir>=0)P.wall=1;}
  if(P.wall&&!P.wallPrev)buzz(5);P.wallPrev=P.wall;
  if(P.wall){P.wallT=.12;P.wallSide=P.wall;}else P.wallT-=dt;
  // yerçekimi, süzülme, rüzgâr
  let g=GRAV;const wind=here==='W';
  if(P.vy<0&&!jumpHeld()&&!P.cut){P.vy*=.48;P.cut=true;}
  P.glide=save.glide&&!P.ground&&jumpHeld()&&P.vy>-60&&!P.wall&&P.atk<=0;
  if(wind){if(P.glide){P.vy=Math.max(P.vy-2300*dt,-330);g=0;}else g=GRAV*.35;if(Math.random()<.1)spark(cx+(Math.random()-.5)*20,P.y+P.h,'rgba(255,255,255,.7)',0,-160);}
  if(!wind){if(jumpHeld()&&Math.abs(P.vy)<95&&!P.ground)g*=.55;else if(P.vy>0)g*=1.15;}

  P.vy=Math.min(P.vy,MAXF);

      if(keys.down&&onDropable(P)){P.vy=40;P.drop=.25;}}
    else if(P.wallT>0){const away=dir===-P.wallSide;P.vy=away?-570:-640;P.vx=-P.wallSide*(away?330:250);P.f=-P.wallSide;P.lock=away?.1:.15;buzz(10);P.wallT=0;P.jbuf=0;P.cut=false;P.jbufGlide=false;SFX.jump();burst(P.wallSide>0?P.x+P.w:P.x,P.y+12,'#d8c7a8',6,60);}
    else if(save.dj&&P.jumps>0){P.vy=-DJ;P.jumps--;P.jbuf=0;P.cut=false;P.jbufGlide=false;SFX.dj();for(let i=0;i<10;i++){const a=i/10*6.28;spark(cx,P.y+P.h,col(CHAPTERS[G.ch-1].pal.acc,.9),Math.cos(a)*90,Math.sin(a)*40+40);}}

}
function onDropable(P){const r=Math.floor((P.y+P.h+2)/TS),c0=Math.floor(P.x/TS),c1=Math.floor((P.x+P.w-.01)/TS);for(let c=c0;c<=c1;c++)if(cell(c,r)==='#')return false;for(let c=c0;c<=c1;c++)if(cell(c,r)==='=')return true;return false;}

/* ================= DÜŞMANLAR ================= */
function eBox(e){if(e.t==='slug')return{x:e.x,y:e.y,w:e.w,h:e.h};if(e.t==='flower')return{x:e.x-12,y:e.y-34,w:24,h:34};if(e.t==='mush')return{x:e.x-15,y:e.y-14,w:30,h:14};return{x:e.x-e.w/2,y:e.y-e.h/2,w:e.w,h:e.h};}
function stepEnts(dt){
  const P=G.P,pb={x:P.x,y:P.y,w:P.w,h:P.h},pc={x:P.x+9,y:P.y+13};
  const ab=P.atk>0?atkBox(P):null;
  for(const e of G.ents){
    e.fl=Math.max(0,(e.fl||0)-dt);
    if(e.t==='slug'){e.vy+=GRAV*dt;e.y+=e.vy*dt;const h=rectHit(e.x,e.y,e.w,e.h,c=>c==='#'||c==='=');if(h&&e.vy>0){e.y=h.r*TS-e.h;e.vy=0;}
      const nx=e.x+e.vx*dt,ahead=e.vx>0?nx+e.w+1:nx-1,foot=e.y+e.h+4;const ground=cell(Math.floor(ahead/TS),Math.floor(foot/TS));
      if(rectHit(nx,e.y,e.w,e.h-2,isSolid)||(e.vy===0&&ground!=='#'&&ground!=='='))e.vx=-e.vx;else e.x=nx;e.ph+=dt*4;}
    else if(e.t==='beetle'){e.ph+=dt;const d=Math.hypot(pc.x-e.hx,pc.y-e.hy);if(d<200){e.hx+=clamp(pc.x-e.hx,-1,1)*28*dt;e.hy+=clamp(pc.y-e.hy,-1,1)*22*dt;}
      e.x=e.hx+Math.sin(e.ph*1.3)*58;e.y=e.hy+Math.sin(e.ph*2.7)*16;}
    else if(e.t==='flower'){e.cd-=dt;const d=Math.hypot(pc.x-e.x,pc.y-(e.y-28));e.open=Math.max(0,e.open-dt*2);if(e.cd<.6&&d<380)e.open=Math.min(1,e.open+dt*4);

    else if(e.t==='mush'){e.sq=Math.max(0,e.sq-dt*4);const mb=eBox(e);if(P.vy>0&&ov(pb,mb)&&P.y+P.h-P.vy*dt<=mb.y+6){P.vy=-1100;P.y=mb.y-P.h-1;P.jumps=save.dj?1:0;P.cut=true;e.sq=1;SFX.bounce();burst(e.x,mb.y,col(CHAPTERS[G.ch-1].pal.acc),14,120);}}

  showToast(r[0],'Yeni yetenek',3.2);setTimeout(()=>loreShow(r[1],4.5),900);}

/* ================= BOSS ================= */
function stepBoss(B,dt){
  const P=G.P,pc={x:P.x+9,y:P.y+13};
  if(B.state==='dead'){B.dead+=dt;if(Math.random()<.5)burst(B.x+(Math.random()-.5)*160,B.y+(Math.random()-.5)*80,'#2a0a3a',6,140);if(B.dead>3.2&&G.mode==='play'){G.mode='outro';endGame();}return;}
  if(!B.act){if(P.y<B.arenaBot-40){B.act=true;B.state='idle';B.t=0;SFX.boss();showToast('Çürüğün Kalbi','Son engel',2.6);G.shake=10;}else return;}
  B.t+=dt;B.fl=Math.max(0,B.fl-dt);
  const sp=B.phase===2?1.35:1;
  if(B.state==='idle'){B.eye=Math.max(0,B.eye-dt*3);if(B.t>1.3/sp){B.state=B.next;B.t=0;B.next=B.next==='spore'?'slam':'spore';B.shots=0;if(B.state==='slam'){const cs=new Set();const pcol=Math.floor(pc.x/TS);cs.add(clamp(pcol,1,13));while(cs.size<(B.phase===2?4:3))cs.add(1+Math.floor(Math.random()*13));B.cols=[...cs];}}}
  else if(B.state==='spore'){if(B.t>B.shots*.28+.3&&B.shots<(B.phase===2?7:5)){B.shots++;const a=Math.atan2(pc.y-B.y,pc.x-B.x)+(Math.random()-.5)*.5;G.ents.push({t:'spore',x:B.x,y:B.y+30,vx:Math.cos(a)*(190*sp),vy:Math.sin(a)*(190*sp),w:16,h:16,life:5,hp:1});tone(300,.2,'sine',.08,180);}
    if(B.t>2.2){B.state='open';B.t=0;}}
  else if(B.state==='slam'){if(B.t>.95&&!B.slammed){B.slammed=true;G.shake=12;SFX.boss();for(const c of B.cols)for(let i=0;i<6;i++)burst(c*TS+16,B.arenaBot-10-i*60,'#5a1a7a',3,120);}
    if(B.slammed&&B.t<1.6){for(const c of B.cols){if(Math.abs(pc.x-(c*TS+16))<24&&pc.y>B.y)hurt(P,1,c*TS+16,false);}}
    if(B.t>1.7){B.slammed=false;B.cols=[];B.state='open';B.t=0;}}
  else if(B.state==='open'){B.eye=Math.min(1,B.eye+dt*3);if(B.t>2.8/sp){B.state='idle';B.t=0;}
    if(B.phase===2&&B.t<dt*2&&G.ents.filter(e=>e.minion).length<2)G.ents.push({t:'beetle',minion:true,hx:B.x+(Math.random()<.5?-120:120),hy:B.y+120,x:B.x,y:B.y+100,w:26,h:22,hp:1,fl:0,ph:Math.random()*6});}
  B.eyeY=lerp(B.y,B.y+120,B.eye);
  // göze vuruş
  if(P.atk>0&&B.eye>.6&&!P.atkHit.includes(B)){const ab=atkBox(P);if(ov(ab,{x:B.x-30,y:B.eyeY-26,w:60,h:52})){P.atkHit.push(B);B.hp--;B.fl=.2;G.hitstop=.1;G.shake=7;SFX.hit();tone(120,.3,'sawtooth',.1,60);burst(B.x,B.eyeY,'#ff7bd8',16,180);if(P.atkDir==='down'){P.vy=-560;P.jumps=save.dj?1:0;}
    if(B.hp<=B.max/2)B.phase=2;if(B.hp<=0){B.state='dead';B.dead=0;G.flash=1;G.flashC='255,250,230';SFX.gift();G.ents=G.ents.filter(e=>e.t!=='spore'&&!e.minion);}}}
  // gövdeye temas

/* ================= GÜNCELLEME ================= */
function update(dt){
  G.t+=dt;const P=G.P;
  if(G.mode==='play'&&P){
    stepPlayer(P,dt);stepEnts(dt);if(G.boss)stepBoss(G.boss,dt);
    // ışık tozları
    for(const m of G.motes){if(m.free){m.vy=(m.vy||0)+300*dt;m.y+=m.vy*dt;if(m.vy>0&&rectHit(m.x-4,m.y,8,6,c=>c==='#'||c==='=')){m.vy=0;m.free=false;}}
      const d=Math.hypot(P.x+9-m.x,P.y+13-m.y);if(d<70){m.x+=(P.x+9-m.x)*dt*6;m.y+=(P.y+13-m.y)*dt*6;}
      if(d<18&&!m.got){m.got=true;SFX.mote();spark(m.x,m.y,'#ffe9a8',0,-40);save.motes++;if(m.id>=0){(save.got[G.ch]=save.got[G.ch]||[]).push(m.id);G.chMotes++;}
        if(save.motes%40===0){save.maxH=Math.min(8,save.maxH+1);P.hearts=save.maxH;showToast('Işık Kalbi','40 ışık tozu',2.4);SFX.gift();}store();}}

    // ışık taşları

    for(let i=0;i<2;i++){const yy=((hash(r*13+c*7+i)*TS-G.t*160)%TS+TS)%TS;ctx.strokeStyle=col(pal.acc,.45);ctx.lineWidth=1.2*SC;ctx.beginPath();ctx.moveTo(x+(6+i*14+Math.sin(G.t*3+r)*3)*SC,y+yy*SC);ctx.lineTo(x+(6+i*14)*SC,y+(yy+9)*SC);ctx.stroke();}}ctx.restore();
  // ışık taşları ve anı taşları
  for(const c of G.cps){const X=(c.x-G.camX)*SC,Y=(c.y-G.camY)*SC;if(Y<-100||Y>CH+100)continue;ctx.save();ctx.translate(X,Y);ctx.scale(SC,SC);
    ctx.fillStyle=rgb(mix(pal.ground,'#888',.25));ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(-9,-30);ctx.quadraticCurveTo(0,-38,9,-30);ctx.lineTo(11,0);ctx.fill();
    ctx.strokeStyle=c.on?col(pal.acc):'rgba(200,200,200,.25)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(0,-10);ctx.moveTo(-5,-22);ctx.lineTo(5,-16);ctx.moveTo(5,-22);ctx.lineTo(-5,-16);ctx.stroke();
    if(c.on){ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(0,-20,0,0,-20,60);g.addColorStop(0,col(pal.acc,.5));g.addColorStop(1,col(pal.acc,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-20,60,0,7);ctx.fill();if(Math.random()<.1)spark(c.x+(Math.random()-.5)*16,c.y-30,col(pal.acc,.8),0,-50);}
    ctx.restore();}
  for(const l of G.lores){const X=(l.x-G.camX)*SC,Y=(l.y-G.camY)*SC;if(Y<-100||Y>CH+100)continue;ctx.save();ctx.translate(X,Y);ctx.scale(SC,SC);ctx.fillStyle=rgb(mix(pal.ground,'#777',.2));ctx.beginPath();ctx.moveTo(-14,0);ctx.quadraticCurveTo(-16,-20,-4,-24);ctx.quadraticCurveTo(12,-24,14,0);ctx.fill();
    ctx.globalCompositeOperation='lighter';ctx.fillStyle=col(pal.acc,.55+.3*Math.sin(G.t*2));ctx.font='bold 9px serif';ctx.textAlign='center';ctx.fillText('ᚱᚢᚾ',0,-10);ctx.restore();}
  // ışık tozları
  ctx.save();ctx.globalCompositeOperation='lighter';for(const m of G.motes){const X=(m.x-G.camX)*SC,Y=(m.y+Math.sin(G.t*2+m.ph)*3-G.camY)*SC;if(Y<-30||Y>CH+30)continue;const g=ctx.createRadialGradient(X,Y,0,X,Y,14*SC);g.addColorStop(0,'rgba(255,255,240,1)');g.addColorStop(.3,'rgba(255,233,168,.6)');g.addColorStop(1,'rgba(255,233,168,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,14*SC,0,7);ctx.fill();}ctx.restore();
  // varlıklar, boss, oyuncu
  drawBoss(G.boss,pal);
  for(const e of G.ents){const ey=e.y!==undefined?e.y:e.hy;if((ey-G.camY)*SC<-120||(ey-G.camY)*SC>CH+120)continue;drawEnt(e,pal);}
  if(G.P&&(G.mode==='play'||G.mode==='trans'||G.mode==='title'||G.mode==='outro'))drawPiril(G.P,pal);
  // parçacıklar
  for(const p of G.parts){const X=(p.x-G.camX)*SC,Y=(p.y-G.camY)*SC,a=clamp(p.life/p.max,0,1);if(p.k==='glow'){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(X,Y,0,X,Y,p.sz*2*SC);g.addColorStop(0,p.col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,p.sz*2*SC,0,7);ctx.fill();ctx.restore();}else{ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(X,Y,p.sz*SC,0,7);ctx.fill();ctx.globalAlpha=1;}}
  ctx.restore();
  // karanlık ve ışık haritası
  if(pal.dark>0){const q=.5;if(!LM||LM.width!==Math.ceil(CW*q)||LM.height!==Math.ceil(CH*q)){LM=off(CW*q,CH*q);}const g=LM.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.clearRect(0,0,LM.width,LM.height);g.fillStyle=rgb(mix(pal.ground,'#000',.5),pal.dark);g.fillRect(0,0,LM.width,LM.height);g.globalCompositeOperation='destination-out';
    const hole=(x,y,r,s=1)=>{const X=(x-G.camX)*SC*q,Y=(y-G.camY)*SC*q,R=r*SC*q;if(Y<-R||Y>LM.height+R)return;const gr=g.createRadialGradient(X,Y,0,X,Y,R);gr.addColorStop(0,`rgba(0,0,0,${s})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(X,Y,R,0,7);g.fill();};
    if(G.P)hole(G.P.x+9,G.P.y+8,240);for(const m of G.motes)hole(m.x,m.y,46,.7);for(const c of G.cps)hole(c.x,c.y-20,c.on?150:60,.8);for(const e of G.ents){if(e.t==='mush')hole(e.x,e.y-14,110,.85);else if(e.t==='gift')hole(e.x,e.y,180);else if(e.t==='spore')hole(e.x,e.y,50,.6);else if(e.t==='flower')hole(e.x,e.y-28,50,.5);}
    if(G.boss&&G.boss.act)hole(G.boss.x,G.boss.eyeY,180,.8);
    const r0=Math.floor(G.camY/TS),r1=r0+Math.ceil(VH/TS)+1;for(let r=r0;r<=r1;r++)for(let c=0;c<MW;c++){if(cell(c,r)==='#'&&cell(c,r-1)!=='#'&&(r*7+c*13)%5===0)hole(c*TS+16,r*TS,70,.45);}
    ctx.drawImage(LM,0,0,CW,CH);}
  // ön plan yaprakları
  const pf=1.35,tile=700,k0=Math.floor(G.camY*pf/tile)-1,k1=k0+Math.ceil(VH*pf/tile)+2;
  for(let k=k0;k<=k1;k++){if(hash(k*3.3)<.35)continue;const L=hash(k*1.7)<.5,img=fgSprite(k%4,pal),w=260*SC*.9,h=320*SC*.9,y=(k*tile-G.camY*pf)*SC,x=L?-w*.45:CW-w*.55;ctx.save();if(!L){ctx.translate(CW,0);ctx.scale(-1,1);ctx.drawImage(img,-w*.45,y,w,h);}else ctx.drawImage(img,x,y,w,h);ctx.restore();}
  // ortam parçacıkları
  ctx.save();ctx.globalCompositeOperation=pal.amb==='leaf'||pal.amb==='petal'?'source-over':'lighter';
  for(const a of AMB){const sp=pal.amb==='leaf'||pal.amb==='petal'?40:pal.amb==='ember'?-24:-10;a.y+=(sp*a.z)/CH*.016;if(a.y>1.1)a.y-=1.2;if(a.y<-.1)a.y+=1.2;const X=((a.x*CW+Math.sin(G.t*.7+a.ph)*30*a.z)%CW+CW)%CW,Y=((a.y*CH-G.camY*SC*.15*a.z)%CH+CH)%CH;
    if(pal.amb==='leaf'||pal.amb==='petal'){ctx.save();ctx.translate(X,Y);ctx.rotate(G.t*a.z+a.ph);ctx.fillStyle=pal.amb==='leaf'?col(a.s<.5?pal.moss:pal.rim,.7):`rgba(255,${180+a.s*60|0},${200+a.s*40|0},.75)`;ctx.beginPath();ctx.ellipse(0,0,4*a.z*SC,2*a.z*SC,0,0,7);ctx.fill();ctx.restore();}
    else{const r=(pal.amb==='star'?1.4:2.6)*a.z*SC,tw=.5+.5*Math.sin(G.t*3+a.ph);const g=ctx.createRadialGradient(X,Y,0,X,Y,r*4);g.addColorStop(0,col(pal.amb==='ember'?'#ffc070':pal.acc,.6*tw));g.addColorStop(1,col(pal.acc,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,r*4,0,7);ctx.fill();}}
  ctx.restore();
  // vinyet ve geçişler
  const vg=ctx.createRadialGradient(CW/2,CH*.5,Math.min(CW,CH)*.3,CW/2,CH*.5,Math.max(CW,CH)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);
  if(G.flash>0){ctx.fillStyle=`rgba(${G.flashC},${G.flash*.45})`;ctx.fillRect(0,0,CW,CH);}
  if(G.P&&G.P.dead){ctx.fillStyle=`rgba(0,0,0,${clamp(1-G.P.dead/1.6,0,1)*.9})`;ctx.fillRect(0,0,CW,CH);}
  if(G.fade>0){ctx.fillStyle=`rgba(0,0,0,${G.fade})`;ctx.fillRect(0,0,CW,CH);}
}

/* ================= AKIŞ ================= */
function startChapter(n,fresh){
  buildChapter(n);if(fresh){save.cp=-1;}save.ch=n;store();
  respawn(true);G.mode='play';G.exitT=0;G.fade=1;G.lastLore=-1;
  ['title','chapters','story','pause','how'].forEach(id=>$(id).hidden=true);$('hud').hidden=false;$('tc').hidden=!touchUI;$('chap').textContent=CHAPTERS[n-1].name;$('hearts').dataset.v='';
  showToast(CHAPTERS[n-1].name,'Bölüm '+n+' · '+CHAPTERS[n-1].sub,3);
  if(n===1&&!save.hint){save.hint=true;store();setTimeout(()=>{if(G.mode==='play')loreShow(touchUI?'Sol yarıda parmağını sürükle: koş. ZIPLA: zıpla, VUR: kuyrukla vur. Duvara değince tutunursun.':tvMode()?'Yön tuşları: koş. OK: zıpla. Düşmanlara yaklaşınca Pırıl kendiliğinden vurur. Duvara değince tutunursun.':'← →: koş · Boşluk: zıpla · X: vur · Shift: kay. Duvara değince tutunursun.',7);},3200);}
  if(document.activeElement)document.activeElement.blur();}
let stIdx=0,stList=[],stDone=null;
function story(list,eye,done){stList=list;stIdx=0;stDone=done;$('stEye').textContent=eye;['title','chapters','pause','how'].forEach(id=>$(id).hidden=true);$('hud').hidden=true;$('tc').hidden=true;$('story').hidden=false;stShow();$('stNext').focus();}
let typeT=0;
function stShow(){const t=stList[stIdx],el=$('stText');el.textContent='';let i=0;clearInterval(typeT);typeT=setInterval(()=>{i+=2;el.textContent=t.slice(0,i);if(i>=t.length)clearInterval(typeT);},22);
  $('stDots').innerHTML=stList.map((_,i)=>`<i class="${i===stIdx?'on':''}"></i>`).join('');$('stNext').textContent=stIdx<stList.length-1?'Devam':'Başla';}
$('stNext').onclick=()=>{au();const el=$('stText'),t=stList[stIdx];if(el.textContent.length<t.length){clearInterval(typeT);el.textContent=t;return;}stIdx++;if(stIdx<stList.length)stShow();else{$('story').hidden=true;stDone&&stDone();}};
function endGame(){setTimeout(()=>{save.ended=true;store();story(OUTRO,'Son',()=>{showTitle();showToast('Teşekkürler','Işık tozu '+save.motes+' · Düşüş '+save.deaths,5);});},400);}
function showTitle(){G.mode='title';buildChapter(save.ch||1);respawn(true);G.P.vx=0;['chapters','story','pause','how'].forEach(id=>$(id).hidden=true);$('title').hidden=false;$('hud').hidden=true;$('tc').hidden=true;
  $('startB').textContent=save.intro?(save.ended?'Yeniden oyna':'Devam et · '+CHAPTERS[(save.ch||1)-1].name):'Yolculuğa başla';sndL();$('startB').focus();}
function sndL(){$('sndB').textContent=$('snd2B').textContent='Ses: '+(save.snd?'Açık':'Kapalı');}
$('startB').onclick=()=>{au();if(!save.intro){story(INTRO,'Başlangıç',()=>{save.intro=true;store();startChapter(1,true);});}else if(save.ended){save.ended=false;startChapter(1,true);}else startChapter(save.ch||1,false);};
$('chapB').onclick=()=>{const el=$('chList');el.innerHTML='';CHAPTERS.forEach((c,i)=>{const n=i+1,open=n===1||save.done.includes(n-1)||save.ch>=n;const b=document.createElement('button');b.className='b g';b.disabled=!open;b.innerHTML=`<span>${n}. ${c.name}</span><small>${save.done.includes(n)?'Tamamlandı':open?c.sub:'Kilitli'}</small>`;b.onclick=()=>{au();startChapter(n,true);};el.appendChild(b);});$('title').hidden=true;$('chapters').hidden=false;el.querySelector('button:not([disabled])').focus();};
$('chBack').onclick=()=>{$('chapters').hidden=true;$('title').hidden=false;$('chapB').focus();};
function ctlRender(){
  const tv=tvMode(),row=(k,v)=>`<b>${k}</b><span>${v}</span>`;
  let h='';
  h+='<h3>Dokunmatik</h3>'+row('Sol yarı','Parmağını koy, sürükle: koş, tırman, aşağı yönle kay')+row('ZIPLA','Basılı tut: daha yükseğe; havada tekrar: çift zıplama; basılı tut: süzül')+row('VUR / KAY','Kuyrukla vur (çubukla yukarı/aşağı yönlendir), yerde hızla kay');
  h+='<h3>Klavye</h3>'+row('← → ↑ ↓','Koş, tırman, nişan al')+row('Boşluk / Z / C','Zıpla')+row('X / J'+(tv?'':' / Enter'),'Kuyrukla vur')+row('Shift / ↓','Kay; dalda ↓ basılı: aşağı in')+row('Esc','Mola');
  h+='<h3>TV kumandası ve oyun kolu</h3>'+row('Yön tuşları','Koş, tırman')+row(tv?'OK':'A','Zıpla')+row(tv?'Vuruş':'X / B','Kuyrukla vur'+(tv?' (yakındaki düşmana kendiliğinden)':''))+row('↓ / omuz tuşu','Kay')+row('Geri / Start','Mola');
  h+='<h3>Hareket</h3>'+row('Duvar','Değince tutunursun, zıplayınca karşıya sıçrarsın')+row('Sarmaşık','Atla, kendiliğinden tutun; zıplayarak bırak');
  $('keyList').innerHTML=h;
  $('ctlV').textContent={auto:'Otomatik ('+(isTV?'TV':'klavye/dokunmatik')+')',kb:'Klavye',tv:'TV kumandası'}[save.ctl];
  $('autoV').textContent=save.auto===null?'Otomatik ('+(autoAtk()?'açık':'kapalı')+')':save.auto?'Açık':'Kapalı';
  $('vibV').textContent=save.vib?'Açık':'Kapalı';}
let howFrom='title';
function openHow(from){howFrom=from;ctlRender();['title','pause'].forEach(id=>$(id).hidden=true);$('how').hidden=false;$('howBack').focus();}
$('howB').onclick=()=>openHow('title');
$('ctl2B').onclick=()=>openHow('pause');
$('ctlB').onclick=()=>{save.ctl={auto:'kb',kb:'tv',tv:'auto'}[save.ctl];store();ctlRender();};
$('autoB').onclick=()=>{save.auto=save.auto===null?true:save.auto?false:null;store();ctlRender();};
$('vibB').onclick=()=>{save.vib=!save.vib;store();ctlRender();buzz(20);};
$('howBack').onclick=()=>{$('how').hidden=true;$(howFrom).hidden=false;(howFrom==='title'?$('howB'):$('ctl2B')).focus();};
$('sndB').onclick=$('snd2B').onclick=()=>{au();save.snd=!save.snd;vol();store();sndL();};
function pause(){if(G.mode!=='play')return;G.mode='pause';$('pause').hidden=false;$('resB').focus();sndL();}
function resume(){$('pause').hidden=true;G.mode='play';}
$('pauseB').onclick=pause;$('resB').onclick=resume;
$('cpB').onclick=()=>{resume();respawn(false);};
$('menuB').onclick=()=>{showTitle();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

/* ================= DÖNGÜ ================= */
let last=performance.now(),acc=0;
function frame(now){const rdt=Math.min(.05,(now-last)/1000);last=now;
  pollPad();syncKeys();
  if(G.hitstop>0)G.hitstop-=rdt;
  else if(G.mode==='play'||G.mode==='trans'||G.mode==='outro'){acc+=rdt;let n=0;while(acc>=DT&&n<10){update(DT);acc-=DT;n++;}}
  else if(G.mode==='title'){G.t+=rdt;if(G.P){G.P.anim+=rdt*2;G.P.state='idle';const ty=G.P.y-VH*.6+Math.sin(G.t*.15)*120;G.camY+=(ty-G.camY)*rdt;G.camX=VIEWW>VW?clamp(G.P.x-VW/2,0,VIEWW-VW):-OXW;}for(const p of G.parts)p.life-=rdt;}
  G.fade=Math.max(0,G.fade-rdt*1.2);
  draw();requestAnimationFrame(frame);}
showTitle();requestAnimationFrame(frame);
window.__piril={G,keys,get save(){return save},sim:{stepPlayer,newPlayer,DT,TS,edge:()=>{jumpEdge=true;},clear:()=>{jumpEdge=false;atkEdge=false;}}};
})();
